<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:
 -apple-system,
 BlinkMacSystemFont,
 "Segoe UI",
 "Noto Sans JP",
 sans-serif;
 background:#f4f6fb;

}

header{

 color:white;
 padding:18px;
}

.header{
 max-width:1100px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:22px;
 font-weight:800;
}

.container{
 max-width:1100px;
 margin:auto;
 padding:20px;
}

.nav{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 margin-bottom:20px;
}

.nav button{

 border:0;
 padding:13px;

 cursor:pointer;
}

.nav button.active{

 color:white;
}

.page{

}

.page.active{

}

.card{

 border-radius:18px;
 margin-bottom:15px;
 box-shadow:0 4px 14px #00000010;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:15px;
}

.item{
 background:white;
 padding:18px;
 border-radius:16px;
 margin-bottom:12px;
 box-shadow:0 3px 10px #0000000d;
}

input,
select,
textarea{
 width:100%;
 padding:12px;
 border:1px solid #ddd;
 border-radius:10px;
 margin:5px 0 12px;
 font-size:15px;
}

textarea{
 min-height:100px;
}

button{
 border:0;
 border-radius:10px;
 padding:11px 15px;
 cursor:pointer;
 font-weight:bold;
}

.primary{
 background:#2563eb;
 color:white;
}

.green{
 background:#16a34a;
 color:white;
}

.red{
 background:#dc2626;
 color:white;
}

.gray{
 background:#e5e7eb;
 color:#222;
}

.badge{

 padding:5px 10px;
 border-radius:20px;
 background:#e8efff;
 color:#2563eb;
 font-size:12px;
}

.parent{
 background:#fff0f0;
 color:#dc2626;
}

.child{
 background:#e8f7ed;
 color:#16803c;
}

.done{
 text-decoration:line-through;
 opacity:.5;
}

.message{
 background:#fff8d8;
 border-left:5px solid #f59e0b;
}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:100;
}

.modal.show{
 display:flex;
}

.modal-box{
 background:white;
 width:100%;
 max-width:500px;
 padding:25px;
 border-radius:20px;
 max-height:90vh;
 overflow:auto;
}

.login{
 max-width:420px;
 margin:60px auto;
}

.family-code{
 font-size:28px;
 font-weight:800;
 letter-spacing:5px;
 color:#2563eb;
}

.empty{
 text-align:center;
 padding:30px;
 color:#777;
}

.hidden{
 display:none!important;
}

@media(max-width:700px){

 .grid{
   grid-template-columns:1fr;
 }

 .nav{
   grid-template-columns:repeat(2,1fr);
 }

 .header{
   gap:10px;
 }

 .logo{
   font-size:18px;
 }

}

</style>

</head>

<script>


/* ==================================
   SUPABASE
================================== */

const SUPABASE_URL =
"https://cxwdndlbtdagvvcuvopm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qux36ew_JkABxzXCQEgW1A_ijJRoraO";

const supabaseClient =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* ==================================
   STATE
================================== */

let currentUser=null;
let currentMember=null;
let currentFamily=null;
let currentForm=null;


/* ==================================
   AUTH
================================== */

async function login(){

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;

const {data,error}=
await supabaseClient.auth
.signInWithPassword({
 email,
 password
});

if(error){

showLoginError(error.message);
return;

}

await initializeApp();

}


async function signup(){

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;

if(!email || !password){

showLoginError(
"メールアドレスとパスワードを入力してください。"
);

return;

}

if(password.length<6){

showLoginError(
"パスワードは6文字以上にしてください。"
);

return;

}

const {data,error}=
await supabaseClient.auth
.signUp({
 email,
 password
});

if(error){

showLoginError(error.message);
return;

}

if(data.session){

await initializeApp();

}else{

alert(
"アカウントを作成しました。\n"+
"メール確認が必要な設定の場合は、"+
"メールを確認してください。"
);

}

}


function showLoginError(message){

document.getElementById("loginError")
.textContent=message;

}


async function logout(){

await supabaseClient.auth.signOut();

location.reload();

}


/* ==================================
   INIT
================================== */

async function initializeApp(){

const {
 data:{user}
}=await supabaseClient.auth.getUser();

if(!user){

showLogin();
return;

}

currentUser=user;

const {data:member,error}=
await supabaseClient
.from("family_members")
.select("*")
.eq("user_id",user.id)
.maybeSingle();

if(error){

console.error(error);

}

if(!member){

await showJoinOrCreate();

return;

}

currentMember=member;

const {data:family}=await supabaseClient
.from("families")
.select("*")
.eq("id",member.family_id)
.single();

if(!family){

alert("家族情報を取得できません。");
return;

}

currentFamily=family;

showApp();

loadAll();

}


function showLogin(){

document.getElementById("loginScreen")
.classList.remove("hidden");

document.getElementById("app")
.classList.add("hidden");

}


function showApp(){

document.getElementById("loginScreen")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

document.getElementById("familyInfo")
.textContent=
currentFamily.name;

document.getElementById("familyCode")
.textContent=
currentFamily.family_code;

const badge=
document.getElementById("roleBadge");

if(currentMember.role==="parent"){

badge.textContent="👑 親";
badge.className="badge parent";

}else{

badge.textContent="🧒 子ども";
badge.className="badge child";

}

applyPermissions();

}


/* ==================================
   FAMILY CREATE / JOIN
================================== */

async function showJoinOrCreate(){

const code=
prompt(
"家族コードを入力してください。\n"+
"新しい家族を作る場合は「新規」と入力してください。"
);

if(code===null)return;

if(code==="新規"){

await createFamily();

}else{

await joinFamily(code);

}

}


async function createFamily(){

const name=
prompt("家族名を入力してください。");

if(!name)return;

const code=
Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();

const {data:family,error}=
await supabaseClient
.from("families")
.insert({
 name,
 family_code:code,
 created_by:currentUser.id
})
.select()
.single();

if(error){

alert(error.message);
return;

}

const memberName=
prompt("あなたの名前を入力してください。");

if(!memberName)return;

const {data:member,error:memberError}=
await supabaseClient
.from("family_members")
.insert({
 family_id:family.id,
 user_id:currentUser.id,
 name:memberName,
 role:"parent",
 icon:"👨"
})
.select()
.single();

if(memberError){

alert(memberError.message);
return;

}

currentFamily=family;
currentMember=member;

showApp();
loadAll();

alert(
"家族を作成しました！\n\n"+
"家族コード："+
code
);

}


async function joinFamily(code){

const {data:family,error}=
await supabaseClient
.from("families")
.select("*")
.eq("family_code",code.toUpperCase())
.single();

if(error || !family){

alert("家族コードが見つかりません。");
return;

}

const name=
prompt("あなたの名前を入力してください。");

if(!name)return;

const role=
confirm(
"親として参加しますか？\n\n"+
"「OK」= 親\n"+
"「キャンセル」= 子ども"
)
?"parent":"child";

const {data:member,error:memberError}=
await supabaseClient
.from("family_members")
.insert({
 family_id:family.id,
 user_id:currentUser.id,
 name,
 role,
 icon:role==="parent"?"👨":"🧒"
})
.select()
.single();

if(memberError){

alert(memberError.message);
return;

}

currentFamily=family;
currentMember=member;

showApp();
loadAll();

}


/* ==================================
   PERMISSION UI
================================== */

function applyPermissions(){

const parent=
currentMember.role==="parent";

document
.getElementById("addDutyButton")
.classList.toggle(
"hidden",
!parent
);

document
.getElementById("addTaskButton")
.classList.toggle(
"hidden",
!parent
);

document
.getElementById("addEventButton")
.classList.toggle(
"hidden",
!parent
);

document
.getElementById("addMessageButton")
.classList.toggle(
"hidden",
!parent
);

}


/* ==================================
   NAV
================================== */

function showPage(id,button){

document
.querySelectorAll(".page")
.forEach(x=>
x.classList.remove("active")
);

document
.getElementById(id)
.classList.add("active");

document
.querySelectorAll(".nav button")
.forEach(x=>
x.classList.remove("active")
);

button.classList.add("active");

}


/* ==================================
   DUTIES
================================== */

async function loadDuties(){

const {data,error}=
await supabaseClient
.from("duties")
.select(
"*,family_members(name)"
)
.eq(
"family_id",
currentFamily.id
)
.order("duty_date");

if(error){

console.error(error);
return;

}

const el=
document.getElementById("dutiesList");

if(!data.length){

el.innerHTML=
'<div class="empty">当番はありません。</div>';

return;

}

el.innerHTML=data.map(x=>`

<div class="item ${x.completed?"done":""}">

<h3>
📋 ${escapeHTML(x.title)}
</h3>

<p>
担当：
${escapeHTML(
x.family_members?.name||"未設定"
)}
</p>

<p>
📅 ${escapeHTML(x.duty_date)}
</p>

<button class="green"
onclick="toggleDuty(
'${x.id}',
${!x.completed}
)">

${x.completed?"未完了":"完了"}

</button>

</div>

`).join("");

}


async function toggleDuty(id,value){

const {error}=
await supabaseClient
.from("duties")
.update({
 completed:value
})
.eq("id",id);

if(error){

alert(error.message);
return;

}

loadDuties();

}


/* ==================================
   TASKS
================================== */

async function loadTasks(){

const {data,error}=
await supabaseClient
.from("tasks")
.select(
"*,family_members(name)"
)
.eq(
"family_id",
currentFamily.id
)
.order("due_date");

if(error)return;

const el=
document.getElementById("tasksList");

if(!data.length){

el.innerHTML=
'<div class="empty">やることはありません。</div>';

return;

}

el.innerHTML=data.map(x=>`

<div class="item ${x.completed?"done":""}">

<h3>
✅ ${escapeHTML(x.title)}
</h3>

<p>
担当：
${escapeHTML(
x.family_members?.name||"家族"
)}
</p>

<p>
期限：
${escapeHTML(x.due_date||"なし")}
</p>

<button class="green"
onclick="toggleTask(
'${x.id}',
${!x.completed}
)">

${x.completed?"未完了":"完了"}

</button>

</div>

`).join("");

}


async function toggleTask(id,value){

await supabaseClient
.from("tasks")
.update({
 completed:value
})
.eq("id",id);

loadTasks();

}


/* ==================================
   EVENTS
================================== */

async function loadEvents(){

const {data,error}=
await supabaseClient
.from("family_events")
.select("*")
.eq(
"family_id",
currentFamily.id
)
.order("event_date");

if(error)return;

const el=
document.getElementById("eventsList");

if(!data.length){

el.innerHTML=
'<div class="empty">予定はありません。</div>';

return;

}

el.innerHTML=data.map(x=>`

<div class="item">

<h3>
📅 ${escapeHTML(x.title)}
</h3>

<p>
${escapeHTML(x.event_date)}
${x.event_time?
" "+escapeHTML(x.event_time):""}
</p>

<p>
${escapeHTML(
x.description||""
)}
</p>

</div>

`).join("");

}


/* ==================================
   MESSAGES
================================== */

async function loadMessages(){

const {data,error}=
await supabaseClient
.from("parent_messages")
.select("*")
.eq(
"family_id",
currentFamily.id
)
.order(
"created_at",
{ascending:false}
);

if(error)return;

const el=
document.getElementById("messagesList");

if(!data.length){

el.innerHTML=
'<div class="empty">メッセージはありません。</div>';

return;

}

el.innerHTML=data.map(x=>`

<div class="item message">

<h3>
💌 ${escapeHTML(x.title)}
</h3>

<p>
${escapeHTML(x.message)}
</p>

<small>
${escapeHTML(x.sender)}
</small>

</div>

`).join("");

}


/* ==================================
   MEMBERS
================================== */

async function loadMembers(){

const {data,error}=
await supabaseClient
.from("family_members")
.select("*")
.eq(
"family_id",
currentFamily.id
)
.order("created_at");

if(error)return;

const el=
document.getElementById("membersList");

el.innerHTML=data.map(x=>`

<div class="item">

<h3>
${escapeHTML(x.icon)}
${escapeHTML(x.name)}
</h3>

<span class="badge ${
x.role==="parent"
?"parent":"child"
}">

${
x.role==="parent"
?"👑 親":"🧒 子ども"
}

</span>

</div>

`).join("");

}


/* ==================================
   FORM
================================== */

function openForm(){

document
.getElementById("formModal")
.classList.add("show");

}

function closeForm(){

document
.getElementById("formModal")
.classList.remove("show");

}


function openDutyForm(){

if(currentMember.role!=="parent"){
alert("親だけが当番を追加できます。");
return;
}

currentForm="duty";

document.getElementById("formTitle")
.textContent="📋 当番を追加";

document.getElementById("formContent")
.innerHTML=`

<input id="title"
placeholder="当番名">

<input id="date"
type="date">

`;

openForm();

}


function openTaskForm(){

if(currentMember.role!=="parent"){
alert("親だけがやることを追加できます。");
return;
}

currentForm="task";

document.getElementById("formTitle")
.textContent="✅ やることを追加";

document.getElementById("formContent")
.innerHTML=`

<input id="title"
placeholder="やること">

<input id="date"
type="date">

`;

openForm();

}


function openEventForm(){

if(currentMember.role!=="parent"){
alert("親だけが予定を追加できます。");
return;
}

currentForm="event";

document.getElementById("formTitle")
.textContent="📅 予定を追加";

document.getElementById("formContent")
.innerHTML=`

<input id="title"
placeholder="予定">

<input id="date"
type="date">

<input id="time"
placeholder="時間">

<textarea id="description"
placeholder="詳細"></textarea>

`;

openForm();

}


function openMessageForm(){

if(currentMember.role!=="parent"){
alert("親だけがメッセージを送れます。");
return;
}

currentForm="message";

document.getElementById("formTitle")
.textContent="💌 親からのメッセージ";

document.getElementById("formContent")
.innerHTML=`

<input id="title"
placeholder="タイトル">

<textarea id="message"
placeholder="メッセージ"></textarea>

`;

openForm();

}


/* ==================================
   SAVE
================================== */

async function saveForm(){

if(currentMember.role!=="parent"){

alert("親だけが追加できます。");
return;

}

let table;
let record;


if(currentForm==="duty"){

table="duties";

record={

family_id:currentFamily.id,

title:
document.getElementById("title").value,

duty_date:
document.getElementById("date").value

};

}


if(currentForm==="task"){

table="tasks";

record={

family_id:currentFamily.id,

title:
document.getElementById("title").value,

due_date:
document.getElementById("date").value

};

}


if(currentForm==="event"){

table="family_events";

record={

family_id:currentFamily.id,

title:
document.getElementById("title").value,

event_date:
document.getElementById("date").value,

event_time:
document.getElementById("time").value,

description:
document.getElementById("description").value

};

}


if(currentForm==="message"){

table="parent_messages";

record={

family_id:currentFamily.id,

title:
document.getElementById("title").value,

message:
document.getElementById("message").value,

sender:currentMember.name

};

}


const {error}=
await supabaseClient
.from(table)
.insert(record);

if(error){

alert(error.message);
return;

}

closeForm();

loadAll();

}


/* ==================================
   HOME
================================== */

async function loadHome(){

const {data:tasks}=
await supabaseClient
.from("tasks")
.select("id")
.eq("family_id",currentFamily.id)
.eq("completed",false);

const {data:duties}=
await supabaseClient
.from("duties")
.select("id")

/* ==================================
   HOME MESSAGE
================================== */

async function loadHomeMessage(){

const {data}=
await supabaseClient
.from("parent_messages")
.select("*")
.eq(
"family_id",
currentFamily.id
)
.order(
"created_at",
{ascending:false}
)
.limit(1);

const el=
document.getElementById("homeMessage");

if(!data?.length){

el.innerHTML="メッセージはありません。";
return;

}

const x=data[0];

el.innerHTML=`

<div class="item message">

<h3>
💌 ${escapeHTML(x.title)}
</h3>

<p>
${escapeHTML(x.message)}
</p>

</div>

`;

}


/* ==================================
   LOAD
================================== */

async function loadAll(){

await loadHome();
await loadHomeMessage();
await loadDuties();
await loadTasks();
await loadEvents();
await loadMessages();
await loadMembers();

}


/* ==================================
   ESCAPE
================================== */

function escapeHTML(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ==================================
   AUTH STATE
================================== */

supabaseClient.auth
.onAuthStateChange(
async(event,session)=>{

if(session && !currentUser){

await initializeApp();

}

if(!session){

showLogin();

}

});


initializeApp();

</script>
