<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族ホーム</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f7fb;
  color:#172033;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:24px;
  padding:30px;
  box-shadow:0 15px 50px rgba(0,0,0,.1);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:800;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#718096;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tabs button{
  flex:1;
  border:0;
  padding:12px;
  border-radius:12px;
  background:#edf1f7;
}

.tabs button.active{
  background:#315efb;
  color:white;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

input,textarea,select{
  width:100%;
  border:1px solid #d9e0ea;
  border-radius:12px;
  padding:12px 14px;
  background:#fff;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.primary{
  width:100%;
  border:0;
  padding:13px 18px;
  border-radius:12px;
  background:#315efb;
  color:#fff;
  font-weight:700;
}

.secondary{
  border:0;
  padding:9px 13px;
  border-radius:10px;
  background:#edf1f7;
}

.danger{
  border:0;
  padding:9px 13px;
  border-radius:10px;
  background:#ffe5e5;
  color:#d93025;
}

.error{
  color:#d93025;
  margin-top:12px;
  white-space:pre-wrap;
}

.success{
  color:#16834a;
  margin-top:12px;
}

/* APP */

.topbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e3e8f0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:20;
}

.top-title{
  font-size:20px;
  font-weight:800;
}

.user-info{
  display:flex;
  align-items:center;
  gap:10px;
}

.role{
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  background:#edf1f7;
}

.role.parent{
  background:#fff0c2;
}

.role.child{
  background:#e3f1ff;
}

.logout{
  border:0;
  padding:8px 12px;
  border-radius:10px;
  background:#f0f2f5;
}

.layout{
  display:flex;
  min-height:calc(100vh - 64px);
}

.sidebar{
  width:230px;
  background:#fff;
  border-right:1px solid #e3e8f0;
  padding:15px;
}

.nav{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:12px;
  border-radius:12px;
  margin-bottom:5px;
  font-weight:600;
}

.nav:hover,
.nav.active{
  background:#edf2ff;
  color:#315efb;
}

.main{
  flex:1;
  padding:25px;
  max-width:1300px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  font-size:28px;
  margin:0 0 20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:15px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.card h3{
  margin-top:0;
}

.item{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.item-title{
  font-size:18px;
  font-weight:800;
}

.item-meta{
  font-size:13px;
  color:#718096;
  margin-top:6px;
}

.item p{
  white-space:pre-wrap;
  line-height:1.7;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#edf1f7;
  font-size:12px;
  font-weight:700;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}

.empty{
  padding:30px;
  text-align:center;
  color:#718096;
}

.stat{
  font-size:32px;
  font-weight:800;
}

.stat-label{
  color:#718096;
}

.family-code{
  font-size:28px;
  font-weight:800;
  letter-spacing:4px;
  text-align:center;
  padding:15px;
  background:#f3f5f9;
  border-radius:14px;
}

/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
}

.close{
  border:0;
  background:#edf1f7;
  width:36px;
  height:36px;
  border-radius:50%;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modal-actions button{
  flex:1;
}

.mobile-menu{
  display:none;
}

@media(max-width:800px){

  .layout{
    display:block;
  }

  .sidebar{
    position:fixed;
    left:-260px;
    top:64px;
    bottom:0;
    z-index:50;
    transition:.2s;
    box-shadow:10px 0 30px rgba(0,0,0,.1);
  }

  .sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:block;
    border:0;
    background:#edf1f7;
    border-radius:10px;
    padding:8px 12px;
    margin-right:10px;
  }

  .main{
    padding:15px;
  }

  .page-title{
    font-size:23px;
  }
}
</style>
</head>

<div class="auth-box">

<div class="field">

<label>メールアドレス</label>

<script>

/* ==================================================
   SUPABASE
   ================================================== */

const SUPABASE_URL =
"https://cxwdndlbtdagvvcuvopm.supabase.co";

/*
  IMPORTANT:
  Paste ONLY your Supabase Publishable key here.
  Do not add Japanese text or spaces.
*/

const SUPABASE_KEY =
"YOUR_SUPABASE_PUBLISHABLE_KEY";


if(
  SUPABASE_KEY ===
  "YOUR_SUPABASE_PUBLISHABLE_KEY"
){

  console.warn(
    "Supabase Publishable key has not been configured."
  );

}


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==================================================
   STATE
   ================================================== */

let currentUser = null;
let currentFamily = null;
let currentMember = null;
let currentForm = null;


/* ==================================================
   HELPERS
   ================================================== */

function $(id){
  return document.getElementById(id);
}


function escapeHTML(value){

  if(value === null ||
     value === undefined){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function isParent(){

  return currentMember &&
         currentMember.role === "parent";

}


function showMessage(
  text,
  type="error"
){

  $("authMessage").className = type;

  $("authMessage").textContent = text;

}


/* ==================================================
   AUTH
   ================================================== */

function showAuth(type){

  $("loginForm")
    .classList.toggle(
      "hidden",
      type !== "login"
    );

  $("registerForm")
    .classList.toggle(
      "hidden",
      type !== "register"
    );

  $("loginTab")
    .classList.toggle(
      "active",
      type === "login"
    );

  $("registerTab")
    .classList.toggle(
      "active",
      type === "register"
    );

  $("authMessage").textContent = "";

}


$("familyMode").addEventListener(
"change",
function(){

  const join =
    this.value === "join";

  $("familyNameField")
    .classList.toggle(
      "hidden",
      join
    );

  $("familyCodeField")
    .classList.toggle(
      "hidden",
      !join
    );

});


/* ==================================================
   REGISTER
   ================================================== */

async function register(){

  const name =
    $("registerName")
      .value
      .trim();

  const email =
    $("registerEmail")
      .value
      .trim();

  const password =
    $("registerPassword")
      .value;

  const mode =
    $("familyMode").value;


  if(!name || !email || !password){

    showMessage(
      "必要な項目を入力してください。"
    );

    return;

  }


  if(password.length < 6){

    showMessage(
      "パスワードは6文字以上にしてください。"
    );

    return;

  }


  /*
    日本語の名前はHTTPヘッダーには入れず、
    Supabase Authのmetadataとして送信します。
  */

  const {
    data,
    error
  } =
  await supabaseClient.auth.signUp({

    email:email,

    password:password,

    options:{
      data:{
        display_name:name
      }
    }

  });


  if(error){

    showMessage(error.message);
    return;

  }


  const user =
    data.user;


  if(!user){

    showMessage(
      "登録しました。メール確認が必要な場合があります。",
      "success"
    );

    return;

  }


  /* JOIN */

  if(mode === "join"){

    const code =
      $("registerFamilyCode")
        .value
        .trim()
        .toUpperCase();


    if(!code){

      showMessage(
        "家族コードを入力してください。"
      );

      return;

    }


    const {
      data:family,
      error:familyError
    } =
    await supabaseClient
      .from("families")
      .select("*")
      .eq("family_code",code)
      .maybeSingle();


    if(familyError){

      showMessage(
        familyError.message
      );

      return;

    }


    if(!family){

      showMessage(
        "家族コードが見つかりません。"
      );

      return;

    }


    const {
      error:memberError
    } =
    await supabaseClient
      .from("family_members")
      .insert({

        family_id:family.id,

        user_id:user.id,

        name:name,

        role:"child"

      });


    if(memberError){

      showMessage(
        memberError.message
      );

      return;

    }


    await loadApp();

    return;

  }


  /* CREATE */

  const familyName =
    $("registerFamilyName")
      .value
      .trim();


  if(!familyName){

    showMessage(
      "家族名を入力してください。"
    );

    return;

  }


  const familyCode =
    await createUniqueFamilyCode();


  const {
    data:family,
    error:familyError
  } =
  await supabaseClient
    .from("families")
    .insert({

      name:familyName,

      family_code:familyCode,

      created_by:user.id

    })
    .select()
    .single();


  if(familyError){

    showMessage(
      familyError.message
    );

    return;

  }


  const {
    error:memberError
  } =
  await supabaseClient
    .from("family_members")
    .insert({

      family_id:family.id,

      user_id:user.id,

      name:name,

      role:"parent"

    });


  if(memberError){

    showMessage(
      memberError.message
    );

    return;

  }


  await loadApp();

}


/* ==================================================
   FAMILY CODE
   ================================================== */

function generateFamilyCode(){

  const chars =
  "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for(let i=0;i<6;i++){

    result +=
      chars[
        Math.floor(
          Math.random() * chars.length
        )
      ];

  }

  return result;

}


async function createUniqueFamilyCode(){

  for(let i=0;i<10;i++){

    const code =
      generateFamilyCode();


    const {
      data
    } =
    await supabaseClient
      .from("families")
      .select("id")
      .eq("family_code",code)
      .maybeSingle();


    if(!data){

      return code;

    }

  }


  throw new Error(
    "家族コードを作成できませんでした。"
  );

}


/* ==================================================
   LOGIN
   ================================================== */

async function login(){

  const email =
    $("loginEmail")
      .value
      .trim();

  const password =
    $("loginPassword")
      .value;


  if(!email || !password){

    showMessage(
      "メールアドレスとパスワードを入力してください。"
    );

    return;

  }


  const {
    error
  } =
  await supabaseClient.auth.signInWithPassword({

    email:email,

    password:password

  });


  if(error){

    showMessage(error.message);
    return;

  }


  await loadApp();

}


/* ==================================================
   LOAD APP
   ================================================== */

async function loadApp(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    return;

  }


  currentUser = user;


  const {
    data:member,
    error:memberError
  } =
  await supabaseClient
    .from("family_members")
    .select("*")
    .eq("user_id",user.id)
    .maybeSingle();


  if(memberError){

    alert(
      "family_members の取得に失敗しました。\n\n"+
      memberError.message
    );

    return;

  }


  if(!member){

    alert(
      "このアカウントには家族情報がありません。"
    );

    return;

  }


  currentMember = member;


  const {
    data:family,
    error:familyError
  } =
  await supabaseClient
    .from("families")
    .select("*")
    .eq("id",member.family_id)
    .single();


  if(familyError){

    alert(
      "families の取得に失敗しました。\n\n"+
      familyError.message
    );

    return;

  }


  currentFamily = family;


  $("authPage")
    .classList.add("hidden");

  $("app")
    .classList.remove("hidden");


  $("headerUserName")
    .textContent =
      member.name ||
      user.email;


  $("headerRole")
    .textContent =
      member.role === "parent"
      ? "親"
      : "子ども";


  $("headerRole")
    .classList.toggle(
      "parent",
      member.role === "parent"
    );


  $("headerRole")
    .classList.toggle(
      "child",
      member.role !== "parent"
    );


  $("homeFamilyName")
    .textContent =
      family.name;


  $("homeFamilyCode")
    .textContent =
      family.family_code;


  updatePermissionUI();

  await loadAll();

}

function showPage(

){

  document
    .querySelectorAll(".page")
    .forEach(
      p => p.classList.remove("active")
    );


  $("page-"+name)
    .classList.add("active");


  document
    .querySelectorAll(".nav")
    .forEach(

    );

  if(!confirm(
    "このニュースを削除しますか？"
  )) return;


  const {
    error
  } =
  await supabaseClient
    .from("family_news")
    .delete()
    .eq("id",id);


  if(error){

    alert(error.message);
    return;

  }


  await loadNews();

}


/* ==================================================
   MEMBERS
   ================================================== */

async function loadMembers(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("family_members")
    .select("*")
    .eq("family_id",currentFamily.id);


  if(error){

    $("membersList").innerHTML =
      `<div class="card">
      メンバーを取得できません。
      </div>`;

    return;

  }


  $("membersList").innerHTML =
  data.map(item => `

  <div class="item">

  <div class="item-title">

  ${
    item.role === "parent"
    ? "👑"
    : "🧒"
  }

  ${escapeHTML(item.name || "名前なし")}

  </div>

  <div class="item-meta">

  ${
    item.role === "parent"
    ? "親"
    : "子ども"
  }

  </div>

  </div>

  `).join("");

}


/* ==================================================
   MODAL
   ================================================== */

function openModal(){

  $("modalBg")
    .classList.add("show");

}


function closeModal(){

  $("modalBg")
    .classList.remove("show");

  currentForm = null;

}


async function saveModal(){

  if(currentForm === "duty")
    return saveDuty();

  if(currentForm === "task")
    return saveTask();

  if(currentForm === "event")
    return saveEvent();

  if(currentForm === "message")
    return saveMessage();

  if(currentForm === "law")
    return saveLaw();

  if(currentForm === "news")
    return saveNews();

}


/* ==================================================
   AUTH STATE
   ================================================== */

supabaseClient.auth.onAuthStateChange(
async function(event,session){

  if(
    session &&
    session.user &&
    !currentUser
  ){

    await loadApp();

  }

});
