<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>家族ホーム</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Arial,"Noto Sans JP",sans-serif;
 background:#f3f6fb;
 color:#172033;
}

button,input,textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none!important;
}

header{
 height:65px;
 background:white;
 border-bottom:1px solid #ddd;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 position:sticky;
 top:0;
 z-index:10;
}

.headerTitle{
 font-size:20px;
 font-weight:900;
}

.logout{
 border:0;
 background:#edf1f7;
 padding:9px 13px;
 border-radius:9px;
}

.layout{
 display:flex;
 min-height:calc(100vh - 65px);
}

nav{
 width:230px;
 background:#111827;
 padding:12px;
}

nav button{
 display:block;
 width:100%;
 border:0;
 background:transparent;
 color:#dbe3ef;
 padding:12px;
 border-radius:9px;
 text-align:left;
 margin-bottom:4px;
}

nav button.active,
nav button:hover{
 background:#293548;
 color:white;
}

main{
 flex:1;
 padding:25px;
}

.page{
 display:none;
}

.page.active{
 display:block;
}

.card{
 background:white;
 padding:20px;
 border-radius:17px;
 margin-bottom:16px;
 box-shadow:0 3px 15px #0001;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:15px;
}

.stat{
 font-size:28px;
 font-weight:900;
}

.field{
 margin-bottom:14px;
}

.field label{
 display:block;
 font-weight:bold;
 margin-bottom:6px;
}

.field input,
.field textarea{
 width:100%;
 padding:11px;
 border:1px solid #d6ddea;
 border-radius:10px;
}

textarea{
 min-height:110px;
 resize:vertical;
}

.primary{
 border:0;
 background:#536dfe;
 color:white;
 padding:11px 16px;
 border-radius:10px;
 font-weight:bold;
}

.green{
 background:#16a34a;
}

.red{
 background:#dc2626;
}

.item{
 background:#f8fafc;
 border:1px solid #e1e7ef;
 padding:15px;
 border-radius:12px;
 margin-top:10px;
}

.itemTitle{
 font-weight:900;
 font-size:17px;
}

.meta{
 color:#687386;
 font-size:13px;
 margin-top:5px;
}

.amount{
 font-size:21px;
 font-weight:900;
 margin-top:8px;
}

.plus{
 color:#15803d;
}

.minus{
 color:#dc2626;
}

.summary{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:12px;
}

.summaryBox{
 padding:15px;
 background:#f8fafc;
 border-radius:12px;
}

.empty{
 text-align:center;
 padding:20px;
 color:#7b8495;
}

@media(max-width:700px){

 .layout{
  flex-direction:column;
 }

 nav{
  width:100%;
  display:flex;
  overflow-x:auto;
 }

 nav button{
  min-width:115px;
 }

 main{
  padding:13px;
 }

}

</style>
</head>

<body>

<div id="app">

<header>

<div class="headerTitle">
👨‍👩‍👧 家族ホーム
</div>

<div>
<span id="familyHeader"></span>

<button
class="logout"
onclick="logout()">
ログアウト
</button>
</div>

</header>


<div class="layout">

<nav>

<button class="active"
onclick="showPage('home',this)">
🏠 ホーム
</button>

<button onclick="showPage('members',this)">
👨‍👩‍👧 家族
</button>

<button onclick="showPage('fine',this)">
⚖️ 罰金
</button>

<button onclick="showPage('allowance',this)">
🪙 お小遣い
</button>

<button onclick="showPage('news',this)">
📰 家族ニュース
</button>

<button onclick="showPage('law',this)">
⚖️ 家族の法律
</button>

<button onclick="showPage('calendar',this)">
📅 予定表
</button>

</nav>


<main>


<!-- HOME -->

<section id="home" class="page active">

<h1>🏠 ホーム</h1>

<div class="grid">

<div class="card">

<h2>家族</h2>

<div
id="homeFamily"
class="stat">
</div>

<div class="meta">
家族コード：
<span id="familyCode"></span>
</div>

</div>


<div class="card">

<h2>ログイン中</h2>

<div
id="homeUser"
class="stat">
</div>

<div id="homeRole"></div>

</div>

</div>

</section>



<!-- MEMBERS -->

<section id="members" class="page">

<h1>👨‍👩‍👧 家族</h1>

<div class="card">

<div id="membersList"></div>

</div>

</section>



<!-- FINE -->

<section id="fine" class="page">

<h1>⚖️ 罰金</h1>

<div
id="parentFine"
class="card">

<h2>➕ 罰金を追加</h2>

<div class="field">

<label>対象の子ども</label>

<select id="fineMember"></select>

</div>

<div class="field">

<label>金額</label>

<input
id="fineAmount"
type="number"
min="1"
placeholder="500">

</div>

<div class="field">

<label>理由</label>

<input
id="fineReason"
placeholder="家族のルールを守らなかった">

</div>

<button
class="primary red"
onclick="addFine()">

罰金を登録

</button>

</div>


<div class="card">

<h2>📋 罰金一覧</h2>

<div id="fineList"></div>

</div>

</section>



<!-- ALLOWANCE -->

<section id="allowance" class="page">

<h1>🪙 お小遣い</h1>


<div
id="parentAllowance"
class="card">

<h2>➕ お小遣いを渡す</h2>

<div class="field">

<label>誰に？</label>

<select id="allowanceMember"></select>

</div>

<div class="field">

<label>金額</label>

<input
id="allowanceAmount"
type="number"
min="1"
placeholder="1000">

</div>

<div class="field">

<label>何をしたので？</label>

<input
id="allowanceReason"
placeholder="お手伝いをした">

</div>

<button
class="primary green"
onclick="addAllowance()">

お小遣いを登録

</button>

</div>


<div class="card">

<h2>💰 お小遣い残高</h2>

<div
id="allowanceSummary"
class="summary">
</div>

</div>


<div class="card">

<h2>🛍️ お小遣いを使った</h2>

<p>
自分が何にいくら使ったか記録できます。
</p>

<div class="field">

<label>何に使った？</label>

<input
id="spendingItem"
placeholder="例：ゲーム">

</div>

<div class="field">

<label>いくら？</label>

<input
id="spendingAmount"
type="number"
min="1"
placeholder="500">

</div>

<button
class="primary"
onclick="addSpending()">

🛍️ 支出を記録

</button>

</div>


<div class="card">

<h2>📋 お小遣い・支出履歴</h2>

<div id="allowanceList"></div>

</div>

</section>



<!-- NEWS -->

<section id="news" class="page">

<h1>📰 家族ニュース</h1>


<div
id="parentNews"
class="card">

<h2>➕ ニュースを追加</h2>

<div class="field">

<label>タイトル</label>

<input
id="newsTitle"
placeholder="例：今週のお知らせ">

</div>

<div class="field">

<label>内容</label>

<textarea
id="newsContent"
placeholder="家族のみんなへ..."></textarea>

</div>

<button
class="primary"
onclick="addNews()">

📰 ニュースを公開

</button>

</div>


<div class="card">

<h2>📰 ニュース一覧</h2>

<div id="newsList"></div>

</div>

</section>



<!-- LAW -->

<section id="law" class="page">

<h1>⚖️ 家族の法律</h1>


<div
id="parentLaw"
class="card">

<h2>➕ 家族の法律を追加</h2>

<div class="field">

<label>ルール名</label>

<input
id="lawTitle"
placeholder="例：ゲームは夜9時まで">

</div>

<div class="field">

<label>内容</label>

<textarea
id="lawContent"
placeholder="家族で決めたルール"></textarea>

</div>

<div class="field">

<label>違反時の罰金</label>

<input
id="lawFine"
type="number"
min="0"
placeholder="500">

</div>

<button
class="primary"
onclick="addLaw()">

⚖️ 法律を追加

</button>

</div>


<div class="card">

<h2>📋 家族の法律一覧</h2>

<div id="lawList"></div>

</div>

</section>



<!-- CALENDAR -->

<section id="calendar" class="page">

<h1>📅 予定表</h1>

<div class="card">

<div class="empty">
予定表機能はここに追加できます。
</div>

</div>

</section>


</main>
</div>
</div>



<script>

/* =====================================================
 SUPABASE
===================================================== */

const SUPABASE_URL =
"https://cxwdndlbtdagvvcuvopm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qux36ew_JkABxzXCQEgW1A_ijJRoraO";

const db =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =====================================================
 STATE
===================================================== */

let user=null;
let member=null;
let family=null;
let members=[];


/* =====================================================
 UTILS
===================================================== */

function $(id){
 return document.getElementById(id);
}

function esc(v){
 return String(v ?? "")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}


/* =====================================================
 PAGE
===================================================== */

function showPage(id,button){

 document
 .querySelectorAll(".page")
 .forEach(x=>{
  x.classList.remove("active");
 });

 $(id).classList.add("active");

 document
 .querySelectorAll("nav button")
 .forEach(x=>{
  x.classList.remove("active");
 });

 button.classList.add("active");

}


/* =====================================================
 START
===================================================== */

async function start(){

 const session =
 await db.auth.getSession();

 if(!session.data.session){

  alert("ログインしてください。");

  return;

 }

 user=session.data.session.user;


 const m =
 await db
 .from("family_app_v2_members")
 .select("*")
 .eq("user_id",user.id)
 .maybeSingle();


 if(m.error){

  alert(
   "家族情報の取得に失敗しました。\n"+
   m.error.message
  );

  return;

 }


 if(!m.data){

  alert(
   "このアカウントはまだ家族に参加していません。"
  );

  return;

 }


 member=m.data;


 const f =
 await db
 .from("family_app_v2_families")
 .select("*")
 .eq("id",member.family_id)
 .single();


 if(f.error){

  alert(f.error.message);

  return;

 }


 family=f.data;


 $("app").style.display="block";


 $("familyHeader").textContent=
 family.family_name;


 $("homeFamily").textContent=
 family.family_name;


 $("familyCode").textContent=
 family.family_code;


 $("homeUser").textContent=
 member.name;


 $("homeRole").textContent=
 member.role==="parent"
 ?"👨‍👩‍👧 親"
 :"🧒 子ども";


 if(member.role!=="parent"){

  $("parentFine").classList.add("hidden");
  $("parentAllowance").classList.add("hidden");
  $("parentNews").classList.add("hidden");
  $("parentLaw").classList.add("hidden");

 }


 await loadMembers();

 await loadAll();

}


/* =====================================================
 MEMBERS
===================================================== */

async function loadMembers(){

 const result=
 await db.rpc(
  "family_app_v2_get_members",
  {
   p_family_id:family.id
  }
 );


 if(result.error){

  console.error(result.error);

  return;

 }


 members=result.data || [];


 $("membersList").innerHTML=
 members.map(m=>`

 <div class="item">

  <div class="itemTitle">

   ${m.role==="parent"?"👨‍👩‍👧":"🧒"}

   ${esc(m.name)}

  </div>

  <div class="meta">

   ${
    m.role==="parent"
    ?"親"
    :"子ども"
   }

  </div>

 </div>

 `).join("");


 const children=
 members.filter(
  m=>m.role!=="parent"
 );


 $("fineMember").innerHTML=
 children.map(m=>`

  <option value="${m.id}">
   ${esc(m.name)}
  </option>

 `).join("");


 $("allowanceMember").innerHTML=
 children.map(m=>`

  <option value="${m.id}">
   ${esc(m.name)}
  </option>

 `).join("");

}


/* =====================================================
 ALL
===================================================== */

async function loadAll(){

 await loadNews();

 await loadLaws();

 await loadFine();

 await loadAllowance();

}


/* =====================================================
 NEWS
===================================================== */

async function loadNews(){

 const result=
 await db
 .from("family_app_v2_news")
 .select("*")
 .eq("family_id",family.id)
 .order("created_at",{ascending:false});


 if(result.error){

  $("newsList").innerHTML=
  `<div class="empty">
   ${esc(result.error.message)}
  </div>`;

  return;

 }


 if(!result.data.length){

  $("newsList").innerHTML=
  `<div class="empty">
   まだ家族ニュースはありません。
  </div>`;

  return;

 }


 $("newsList").innerHTML=
 result.data.map(n=>`

 <div class="item">

  <div class="itemTitle">
   📰 ${esc(n.title)}
  </div>

  <div class="meta">
   ${new Date(n.created_at).toLocaleString("ja-JP")}
  </div>

  <p>
   ${esc(n.content).replaceAll("\n","<br>")}
  </p>

 </div>

 `).join("");

}


async function addNews(){

 if(member.role!=="parent"){

  alert("ニュースを追加できるのは親です。");

  return;

 }


 const title=
 $("newsTitle").value.trim();

 const content=
 $("newsContent").value.trim();


 if(!title || !content){

  alert("タイトルと内容を入力してください。");

  return;

 }


 const result=
 await db.rpc(
  "family_app_v2_add_news",
  {
   p_family_id:family.id,
   p_title:title,
   p_content:content
  }
 );


 if(result.error){

  alert(result.error.message);

  return;

 }


 $("newsTitle").value="";
 $("newsContent").value="";


 await loadNews();


 alert("ニュースを追加しました！");

}


/* =====================================================
 LAW
===================================================== */

async function loadLaws(){

 const result=
 await db
 .from("family_app_v2_laws")
 .select("*")
 .eq("family_id",family.id)
 .order("created_at",{ascending:false});


 if(result.error){

  $("lawList").innerHTML=
  `<div class="empty">
   ${esc(result.error.message)}
  </div>`;

  return;

 }


 if(!result.data.length){

  $("lawList").innerHTML=
  `<div class="empty">
   まだ家族の法律はありません。
  </div>`;

  return;

 }


 $("lawList").innerHTML=
 result.data.map(l=>`

 <div class="item">

  <div class="itemTitle">
   ⚖️ ${esc(l.title)}
  </div>

  <p>
   ${esc(l.content).replaceAll("\n","<br>")}
  </p>

  <div class="meta">

   違反時の罰金：
   <b>
   ¥${Number(l.fine_amount).toLocaleString()}
   </b>

  </div>

 </div>

 `).join("");

}


async function addLaw(){

 if(member.role!=="parent"){

  alert("法律を追加できるのは親です。");

  return;

 }


 const title=
 $("lawTitle").value.trim();

 const content=
 $("lawContent").value.trim();

 const fine=
 Number($("lawFine").value)||0;


 if(!title || !content){

  alert("ルール名と内容を入力してください。");

  return;

 }


 const result=
 await db.rpc(
  "family_app_v2_add_law",
  {
   p_family_id:family.id,
   p_title:title,
   p_content:content,
   p_fine_amount:fine
  }
 );


 if(result.error){

  alert(result.error.message);

  return;

 }


 $("lawTitle").value="";
 $("lawContent").value="";
 $("lawFine").value="";


 await loadLaws();


 alert("家族の法律を追加しました！");

}


/* =====================================================
 FINE
===================================================== */

async function addFine(){

 const memberId=
 $("fineMember").value;

 const amount=
 Number($("fineAmount").value);

 const reason=
 $("fineReason").value.trim();


 if(!memberId || !amount || !reason){

  alert("すべて入力してください。");

  return;

 }


 const result=
 await db.rpc(
  "family_app_v2_add_fine",
  {
   p_family_id:family.id,
   p_member_id:memberId,
   p_amount:amount,
   p_reason:reason
  }
 );


 if(result.error){

  alert(result.error.message);

  return;

 }


 $("fineAmount").value="";
 $("fineReason").value="";


 await loadFine();


 alert("罰金を登録しました。");

}


async function loadFine(){

 const result=
 await db
 .from("family_app_v2_fines")
 .select(
  "*,family_app_v2_members(name)"
 )
 .eq("family_id",family.id)
 .order("created_at",{ascending:false});


 if(result.error){

  $("fineList").innerHTML=
  `<div class="empty">
   ${esc(result.error.message)}
  </div>`;

  return;

 }


 if(!result.data.length){

  $("fineList").innerHTML=
  `<div class="empty">
   罰金はありません。
  </div>`;

  return;

 }


 $("fineList").innerHTML=
 result.data.map(f=>`

 <div class="item">

  <div class="itemTitle">
   ⚖️ ${esc(f.family_app_v2_members?.name)}
  </div>

  <div>
   ${esc(f.reason)}
  </div>

  <div class="amount minus">
   -¥${Number(f.amount).toLocaleString()}
  </div>

  <div class="meta">
   ${new Date(f.created_at).toLocaleString("ja-JP")}
  </div>

 </div>

 `).join("");

}


/* =====================================================
 ALLOWANCE + SPENDING
===================================================== */

async function addAllowance(){

 const memberId=
 $("allowanceMember").value;

 const amount=
 Number($("allowanceAmount").value);

 const reason=
 $("allowanceReason").value.trim();


 if(!memberId || !amount || !reason){

  alert("すべて入力してください。");

  return;

 }


 const result=
 await db.rpc(
  "family_app_v2_add_allowance",
  {
   p_family_id:family.id,
   p_member_id:memberId,
   p_amount:amount,
   p_reason:reason
  }
 );


 if(result.error){

  alert(result.error.message);

  return;

 }


 $("allowanceAmount").value="";
 $("allowanceReason").value="";


 await loadAllowance();


 alert("お小遣いを登録しました！");

}


async function addSpending(){

 const item=
 $("spendingItem").value.trim();

 const amount=
 Number($("spendingAmount").value);


 if(!item || !amount){

  alert("何に使ったかと金額を入力してください。");

  return;

 }


 const result=
 await db.rpc(
  "family_app_v2_add_spending",
  {
   p_family_id:family.id,
   p_member_id:member.id,
   p_amount:amount,
   p_item:item
  }
 );


 if(result.error){

  alert(result.error.message);

  return;

 }


 $("spendingItem").value="";
 $("spendingAmount").value="";


 await loadAllowance();


 alert("お小遣いの支出を記録しました！");

}


async function loadAllowance(){

 const allowance=
 await db
 .from("family_app_v2_allowances")
 .select(
  "*,family_app_v2_members(name)"
 )
 .eq("family_id",family.id);


 const spending=
 await db
 .from("family_app_v2_spending")
 .select(
  "*,family_app_v2_members(name)"
 )
 .eq("family_id",family.id)
 .order("created_at",{ascending:false});


 if(allowance.error){

  console.error(allowance.error);

  return;

 }


 if(spending.error){

  console.error(spending.error);

  return;

 }


 /*
  人ごとの集計
 */

 const totals={};


 members.forEach(m=>{

  totals[m.id]={
   name:m.name,
   allowance:0,
   spending:0
  };

 });


 allowance.data.forEach(a=>{

  if(totals[a.member_id]){

   totals[a.member_id].allowance +=
   Number(a.amount);

  }

 });


 spending.data.forEach(s=>{

  if(totals[s.member_id]){

   totals[s.member_id].spending +=
   Number(s.amount);

  }

 });


 $("allowanceSummary").innerHTML=
 Object.values(totals)
 .filter(x=>
  x.allowance>0 ||
  x.spending>0
 )
 .map(x=>{

  const balance=
   x.allowance-x.spending;


  return`

  <div class="summaryBox">

   <b>
   🧒 ${esc(x.name)}
   </b>

   <div class="meta">
   もらった：¥${x.allowance.toLocaleString()}
   </div>

   <div class="meta">
   使った：¥${x.spending.toLocaleString()}
   </div>

   <div class="amount ${
    balance>=0
    ?"plus"
    :"minus"
   }">

   残り
   ¥${balance.toLocaleString()}

   </div>

  </div>

  `;

 }).join("");


 /*
  履歴
 */

 const rows=[];


 allowance.data.forEach(a=>{

  rows.push({

   date:a.created_at,

   html:`

   <div class="item">

    <div class="itemTitle">
     🪙 ${esc(a.family_app_v2_members?.name)}
    </div>

    <div>
     ${esc(a.reason)}
    </div>

    <div class="amount plus">
     +¥${Number(a.amount).toLocaleString()}
    </div>

    <div class="meta">
     ${new Date(a.created_at).toLocaleString("ja-JP")}
    </div>

   </div>

   `

  });

 });


 spending.data.forEach(s=>{

  rows.push({

   date:s.created_at,

   html:`

   <div class="item">

    <div class="itemTitle">
     🛍️ ${esc(s.family_app_v2_members?.name)}
    </div>

    <div>
     ${esc(s.item)}
    </div>

    <div class="amount minus">
     -¥${Number(s.amount).toLocaleString()}
    </div>

    <div class="meta">
     ${new Date(s.created_at).toLocaleString("ja-JP")}
    </div>

   </div>

   `

  });

 });


 rows.sort(
  (a,b)=>
  new Date(b.date)-new Date(a.date)
 );


 $("allowanceList").innerHTML=
 rows.length
 ? rows.map(x=>x.html).join("")
 : `<div class="empty">
    まだ記録がありません。
   </div>`;

}

 LOGOUT

async function logout(){

 await db.auth.signOut();

 location.reload();

}

start();
