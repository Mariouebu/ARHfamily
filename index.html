<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>家族ホーム</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:
 Arial,
 "Noto Sans JP",
 sans-serif;
 background:#f4f7fb;
 color:#172033;
}

button,input,select{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none!important;
}

#auth{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
 background:
 linear-gradient(
 135deg,
 #536dfe,
 #8b5cf6
 );
}

.authBox{
 width:100%;
 max-width:500px;
 background:white;
 padding:30px;
 border-radius:25px;
 box-shadow:0 20px 60px #0004;
}

.logo{
 text-align:center;
 font-size:30px;
 font-weight:900;
}

.subtitle{
 text-align:center;
 color:#6b7280;
 margin-bottom:25px;
}

.tabs{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
 margin-bottom:20px;
}

.tabs button{
 border:0;
 background:#edf1f7;
 padding:11px 5px;
 border-radius:10px;
}

.tabs button.active{
 background:#536dfe;
 color:white;
 font-weight:bold;
}

.field{
 margin-bottom:14px;
}

.field label{
 display:block;
 font-weight:bold;
 margin-bottom:6px;
}

.field input,
.field select{
 width:100%;
 padding:12px;
 border:1px solid #d7deea;
 border-radius:10px;
 outline:none;
}

.primary{
 width:100%;
 background:#536dfe;
 color:white;
 border:0;
 border-radius:11px;
 padding:13px;
 font-weight:bold;
}

.error{
 color:#dc2626;
 margin-top:14px;
 font-weight:bold;
}

.success{
 margin-top:14px;
 background:#ecfdf5;
 color:#166534;
 padding:13px;
 border-radius:10px;
}

#app{
 display:none;
}

header{
 height:65px;
 background:white;
 border-bottom:1px solid #ddd;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:0 20px;
 position:sticky;
 top:0;
 z-index:10;
}

.headerTitle{
 font-size:20px;
 font-weight:900;
}

.headerRight{
 display:flex;
 align-items:center;
 gap:10px;
}

.badge{
 background:#eef2ff;
 color:#4338ca;
 border-radius:20px;
 padding:7px 12px;
 font-size:12px;
 font-weight:bold;
}

.logout{
 border:0;
 background:#edf1f7;
 padding:9px 12px;
 border-radius:9px;
}

.layout{
 display:flex;
 min-height:calc(100vh - 65px);
}

nav{
 width:220px;
 background:#111827;
 padding:12px;
}

nav button{
 width:100%;
 border:0;
 background:transparent;
 color:#dbe3ef;
 padding:12px;
 border-radius:9px;
 text-align:left;
 margin-bottom:4px;
 font-weight:bold;
}

nav button.active,
nav button:hover{
 background:#293548;
 color:white;
}

main{
 flex:1;
 padding:25px;
 max-width:1400px;
}

.page{
 display:none;
}

.page.active{
 display:block;
}

.card{
 background:white;
 padding:20px;
 border-radius:17px;
 margin-bottom:16px;
 box-shadow:0 3px 15px #0000000b;
}

.grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(230px,1fr));
 gap:15px;
}

.item{
 background:#f8fafc;
 border:1px solid #e3e8f0;
 border-radius:12px;
 padding:13px;
 margin-top:10px;
}

.itemTitle{
 font-size:17px;
 font-weight:900;
}

.meta{
 color:#6b7280;
 font-size:13px;
 margin-top:5px;
}

.empty{
 text-align:center;
 padding:20px;
 color:#7b8495;
}

.gray{
 border:0;
 background:#edf1f7;
 border-radius:10px;
 padding:10px 14px;
}

.danger{
 border:0;
 background:#ef4444;
 color:white;
 border-radius:8px;
 padding:8px 12px;
}

.successBox{
 background:#ecfdf5;
 border:1px solid #bbf7d0;
 padding:15px;
 border-radius:12px;
 margin-top:12px;
}

.stat{
 font-size:27px;
 font-weight:900;
}

#modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:100;
}

.modalBox{
 background:white;
 width:100%;
 max-width:550px;
 padding:22px;
 border-radius:20px;
}

.modalHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.close{
 border:0;
 background:#edf1f7;
 width:35px;
 height:35px;
 border-radius:50%;
 font-size:20px;
}

.actions{
 display:flex;
 gap:8px;
 margin-top:12px;
 flex-wrap:wrap;
}

@media(max-width:700px){

.layout{
 flex-direction:column;
}

nav{
 width:100%;
 display:flex;
 overflow:auto;
}

nav button{
 min-width:120px;
}

main{
 padding:13px;
}

.tabs{
 grid-template-columns:1fr;
}

.headerRight{
 gap:4px;
}

}

</style>
</head>

<body>

<!-- =================================
     AUTH
================================= -->

<div id="auth">

<div class="authBox">

<div class="logo">
👨‍👩‍👧 家族ホーム
</div>

<div class="subtitle">
家族専用管理アプリ
</div>

<div class="tabs">

<button
id="tabLogin"
onclick="changeMode('login')">
🔐 ログイン
</button>

<button
id="tabCreate"
onclick="changeMode('create')">
🏠 家族作成
</button>

<button
id="tabJoin"
onclick="changeMode('join')">
👨‍👩‍👧 参加
</button>

</div>


<!-- LOGIN -->

<div id="loginForm">

<div class="field">

<label>
メールアドレス
</label>

<input
id="loginEmail"
type="email"
autocomplete="email"
placeholder="メールアドレス">

</div>


<div class="field">

<label>
パスワード
</label>

<input
id="loginPassword"
type="password"
autocomplete="current-password"
placeholder="パスワード">

</div>


<button
class="primary"
onclick="login()">

🔐 ログイン

</button>

</div>


<!-- CREATE -->

<div
id="createForm"
class="hidden">

<div class="field">

<label>
家族名
</label>

<input
id="familyName"
placeholder="例：山田家">

</div>


<div class="field">

<label>
あなたの名前
</label>

<input
id="createName"
placeholder="例：お父さん">

</div>


<div class="field">

<label>
メールアドレス
</label>

<input
id="createEmail"
type="email"
autocomplete="email">

</div>


<div class="field">

<label>
パスワード
</label>

<input
id="createPassword"
type="password"
autocomplete="new-password">

</div>


<button
class="primary"
onclick="createFamily()">

🏠 家族を作る

</button>

</div>


<!-- JOIN -->

<div
id="joinForm"
class="hidden">

<div class="field">

<label>
家族コード
</label>

<input
id="familyCode"
placeholder="例：A1B2C3D4">

</div>


<div class="field">

<label>
名前
</label>

<input
id="joinName"
placeholder="例：太郎">

</div>


<div class="field">

<label>
メールアドレス
</label>

<input
id="joinEmail"
type="email"
autocomplete="email">

</div>


<div class="field">

<label>
パスワード
</label>

<input
id="joinPassword"
type="password"
autocomplete="new-password">

</div>


<div class="field">

<label>
参加する立場
</label>

<select id="joinRole">

<option value="child">
🧒 子ども
</option>

<option value="parent">
👨‍👩‍👧 親
</option>

</select>

</div>


<div
id="parentCodeBox"
class="field hidden">

<label>
親招待コード
</label>

<input
id="parentCode"
placeholder="PARENT-XXXXXXXX">

</div>


<button
class="primary"
onclick="joinFamily()">

👨‍👩‍👧 家族に参加

</button>

</div>


<div
id="error"
class="error">
</div>

<div
id="success"
class="success hidden">
</div>

</div>

</div>


<!-- =================================
     APP
================================= -->

<div id="app">

<header>

<div class="headerTitle">
👨‍👩‍👧 家族ホーム
</div>

<div class="headerRight">

<span id="familyHeader"></span>

<span
id="roleHeader"
class="badge">
</span>

<button
class="logout"
onclick="logout()">
ログアウト
</button>

</div>

</header>


<div class="layout">

<nav>

<button
class="active"
onclick="showPage('home',this)">
🏠 ホーム
</button>

<button
onclick="showPage('members',this)">
👨‍👩‍👧 家族
</button>

<button
onclick="showPage('calendar',this)">
📅 カレンダー
</button>

<button
onclick="showPage('children',this)">
🧒 子ども
</button>

</nav>


<main>

<!-- HOME -->

<section
id="home"
class="page active">

<h1>🏠 ホーム</h1>

<div class="grid">

<div class="card">

<h2>家族</h2>

<div
id="homeFamily">
</div>

</div>


<div class="card">

<h2>アカウント</h2>

<div
id="homeUser">
</div>

</div>

</div>

</section>


<!-- MEMBERS -->

<section
id="members"
class="page">

<h1>👨‍👩‍👧 家族メンバー</h1>

<div
class="card"
id="membersList">
</div>


<div
class="card"
id="parentInviteBox">

<h2>👨‍👩‍👧 親を追加</h2>

<button
class="primary"
onclick="makeInvite()">

＋ 親招待コードを発行

</button>

<div id="inviteResult"></div>

</div>

</section>


<!-- CALENDAR -->

<section
id="calendar"
class="page">

<h1>📅 カレンダー</h1>

<div class="card">

<button
class="primary"
onclick="addEvent()">

＋ 予定を追加

</button>

<div
id="events"
style="margin-top:15px">
</div>

</div>

</section>


<!-- CHILDREN -->

<section
id="children"
class="page">

<h1>🧒 子どもページ</h1>

<div class="card">

<h2>📰 子どもニュース</h2>

<div id="childNews">
<div class="empty">
準備中
</div>
</div>

</div>


<div class="card">

<h2>🎮 ゲーム</h2>

<div id="games">
<div class="empty">
準備中
</div>
</div>

</div>


<div class="card">

<h2>🚨 違反</h2>

<div id="violations">
<div class="empty">
準備中
</div>
</div>

</div>


<div class="card">

<h2>🗳️ 子ども大統領</h2>

<div id="president">
<div class="empty">
準備中
</div>
</div>

</div>

</section>

</main>

</div>

</div>


<!-- MODAL -->

<div id="modal">

<div class="modalBox">

<div class="modalHead">

<h2 id="modalTitle">
</h2>

<button
class="close"
onclick="closeModal()">
×
</button>

</div>

<div id="modalContent">
</div>

<div class="actions">

<button
class="primary"
onclick="saveModal()">

保存

</button>

<button
class="gray"
onclick="closeModal()">

キャンセル

</button>

</div>

</div>

</div>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://cxwdndlbtdagvvcuvopm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qux36ew_JkABxzXCQEgW1A_ijJRoraO";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =================================
   STATE
================================= */

let currentUser=null;
let currentMember=null;
let currentFamily=null;
let modalType=null;


/* =================================
   HELPER
================================= */

function $(id){

return document.getElementById(id);

}


function esc(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function showError(message){

$("error").textContent=
message;

$("success")
.classList.add("hidden");

}


function showSuccess(message){

$("error").textContent="";

$("success")
.classList.remove("hidden");

$("success").innerHTML=
message;

}


/* =================================
   MODE
================================= */

function changeMode(mode){

$("loginForm")
.classList.toggle(
"hidden",
mode!=="login"
);

$("createForm")
.classList.toggle(
"hidden",
mode!=="create"
);

$("joinForm")
.classList.toggle(
"hidden",
mode!=="join"
);

$("tabLogin")
.classList.toggle(
"active",
mode==="login"
);

$("tabCreate")
.classList.toggle(
"active",
mode==="create"
);

$("tabJoin")
.classList.toggle(
"active",
mode==="join"
);

$("error").textContent="";

$("success")
.classList.add("hidden");

}


/* =================================
   ROLE CHANGE
================================= */

$("joinRole").addEventListener(
"change",
function(){

$("parentCodeBox")
.classList.toggle(
"hidden",
this.value!=="parent"
);

}
);


/* =================================
   LOGIN
================================= */

async function login(){

showError("");

const email=
$("loginEmail")
.value
.trim();

const password=
$("loginPassword")
.value;


if(!email || !password){

showError(
"メールアドレスとパスワードを入力してください。"
);

return;

}


const result=
await db.auth.signInWithPassword({

email:email,
password:password

});


if(result.error){

showError(
"ログインできませんでした。\n"+
result.error.message
);

return;

}


currentUser=
result.data.user;


/*
 ログイン成功後、
 必ず家族メンバーを取得
*/

await loadAccount();

}


/* =================================
   CREATE
================================= */

async function createFamily(){

showError("");

const familyName=
$("familyName")
.value
.trim();

const name=
$("createName")
.value
.trim();

const email=
$("createEmail")
.value
.trim();

const password=
$("createPassword")
.value;


if(
!familyName ||
!name ||
!email ||
!password
){

showError(
"すべて入力してください。"
);

return;

}


if(password.length<6){

showError(
"パスワードは6文字以上にしてください。"
);

return;

}


const result=
await db.auth.signUp({

email,
password

});


if(result.error){

showError(
result.error.message
);

return;

}


/*
 メール確認が必要な場合
*/

if(!result.data.session){

showSuccess(
"登録しました。<br><br>"+
"Supabaseでメール確認が有効になっています。<br>"+
"確認メールを開いて認証したあと、"+
"この画面の「ログイン」からログインしてください。"
);

return;

}


currentUser=
result.data.user;


/*
 家族を作成
*/

const rpc=
await db.rpc(
"family_app_v2_create_family",
{
p_family_name:familyName,
p_name:name
}
);


if(rpc.error){

showError(
"家族作成に失敗しました。\n"+
rpc.error.message
);

return;

}


const resultData=
rpc.data;


alert(
"家族を作成しました！\n\n"+
"家族コード："+
resultData.family_code+
"\n\n"+
"親招待コード："+
resultData.parent_invite_code
);


await loadAccount();

}


/* =================================
   JOIN
================================= */

async function joinFamily(){

showError("");

const familyCode=
$("familyCode")
.value
.trim();

const name=
$("joinName")
.value
.trim();

const email=
$("joinEmail")
.value
.trim();

const password=
$("joinPassword")
.value;

const role=
$("joinRole")
.value;

const parentCode=
$("parentCode")
.value
.trim();


if(
!familyCode ||
!name ||
!email ||
!password
){

showError(
"すべて入力してください。"
);

return;

}


if(
role==="parent" &&
!parentCode
){

showError(
"親招待コードを入力してください。"
);

return;

}


const result=
await db.auth.signUp({

email,
password

});


if(result.error){

showError(
result.error.message
);

return;

}


if(!result.data.session){

showSuccess(
"登録しました。<br><br>"+
"メール確認が必要です。<br>"+
"確認後、「ログイン」からログインしてください。"
);

return;

}


currentUser=
result.data.user;


if(role==="child"){

const rpc=
await db.rpc(
"family_app_v2_join_family",
{
p_family_code:familyCode,
p_name:name
}
);


if(rpc.error){

showError(
rpc.error.message
);

return;

}

}else{

const rpc=
await db.rpc(
"family_app_v2_join_as_parent",
{
p_invite_code:parentCode,
p_name:name
}
);


if(rpc.error){

showError(
rpc.error.message
);

return;

}

}


await loadAccount();

}


/* =================================
   ACCOUNT
================================= */

async function loadAccount(){

const session=
await db.auth.getSession();


if(
!session.data.session
){

showLogin();

return;

}


currentUser=
session.data.session.user;


/*
 メンバー情報
*/

const members=
await db
.from("family_app_v2_members")
.select("*")
.eq(
"user_id",
currentUser.id
);


if(members.error){

showError(
members.error.message
);

return;

}


if(
!members.data ||
members.data.length===0
){

showError(
"ログインは成功しましたが、家族情報がありません。"
);

return;

}


currentMember=
members.data[0];


/*
 家族情報
*/

const family=
await db
.from("family_app_v2_families")
.select("*")
.eq(
"id",
currentMember.family_id
)
.single();


if(family.error){

showError(
family.error.message
);

return;

}


currentFamily=
family.data;


openApp();

}


/* =================================
   OPEN APP
================================= */

function openApp(){

$("auth").style.display="none";

$("app").style.display="block";


$("familyHeader")
.textContent=
currentFamily.family_name;


let roleText="🧒 子ども";


if(currentMember.role==="parent"){

roleText="👨‍👩‍👧 親";

}

if(currentMember.role==="president"){

roleText="👑 子ども大統領";

}


$("roleHeader")
.textContent=
roleText;


$("homeFamily").innerHTML=`

<div class="stat">

${esc(
currentFamily.family_name
)}

</div>

<p>
家族コード：
<b>
${esc(
currentFamily.family_code
)}
</b>
</p>

`;


$("homeUser").innerHTML=`

<div class="stat">

${esc(
currentMember.name
)}

</div>

<div>
${roleText}
</div>

`;


loadMembers();

}


/* =================================
   SHOW PAGE
================================= */

function showPage(name,button){

document
.querySelectorAll(".page")
.forEach(
x=>x.classList.remove("active")
);


$(name)
.classList.add("active");


document
.querySelectorAll("nav button")
.forEach(
x=>x.classList.remove("active")
);


button.classList.add("active");

}


/* =================================
   MEMBERS
================================= */

async function loadMembers(){

const result=
await db
.from("family_app_v2_members")
.select("*")
.eq(
"family_id",
currentFamily.id
)
.order("created_at");


if(result.error){

$("membersList")
.textContent=
result.error.message;

return;

}


$("membersList").innerHTML=
result.data
.map(x=>`

<div class="item">

<div class="itemTitle">

${
x.role==="parent"
?"👨‍👩‍👧"
:
x.role==="president"
?"👑"
:"🧒"
}

${esc(x.name)}

</div>

<div class="meta">

${
x.role==="parent"
?"親"
:
x.role==="president"
?"子ども大統領"
:"子ども"
}

</div>

</div>

`)
.join("");


$("parentInviteBox")
.classList.toggle(
"hidden",
currentMember.role!=="parent"
);

}


/* =================================
   INVITE
================================= */

async function makeInvite(){

const result=
await db.rpc(
"family_app_v2_create_parent_invite",
{
p_family_id:currentFamily.id
}
);


if(result.error){

alert(result.error.message);

return;

}


$("inviteResult").innerHTML=`

<div class="successBox">

<h3>
親招待コード
</h3>

<div class="stat">

${esc(result.data)}

</div>

<p>
このコードを親になる人に渡してください。
</p>

</div>

`;

}


/* =================================
   CALENDAR
================================= */

async function addEvent(){

modalType="event";

$("modalTitle")
.textContent=
"📅 予定を追加";


$("modalContent")
.innerHTML=`

<div class="field">

<label>予定名</label>

<input id="eventTitle">

</div>

<div class="field">

<label>日付</label>

<input
id="eventDate"

async function loadEvents(){

/*
 現在は既存の予定テーブルが
 ある場合に読み込みます
*/

const result=
await db
.from("family_app_v2_events")
.select("*")
.eq(
"family_id",
currentFamily.id
)
.order("event_date");


if(result.error){

$("events").innerHTML=
`
<div class="empty">
予定テーブルをまだ設定していません。
</div>
`;

return;

}


if(!result.data.length){

$("events").innerHTML=
`
<div class="empty">
予定はありません
</div>
`;

return;

}


$("events").innerHTML=
result.data.map(x=>`

<div class="item">

<div class="itemTitle">
📅 ${esc(x.title)}
</div>

<div class="meta">
${esc(x.event_date)}
${x.start_time?
" "+esc(x.start_time):
""}
</div>

</div>

`)
.join("");

}


async function saveEvent(){

if(
currentMember.role!=="parent" &&
currentMember.role!=="president"
){

alert(
"予定を追加できるのは親または大統領です。"
);

return;

}


const result=
await db
.from("family_app_v2_events")
.insert({

family_id:currentFamily.id,

title:
$("eventTitle")
.value
.trim(),

event_date:
$("eventDate")
.value,

start_time:
$("eventStart")
.value||null,

end_time:
$("eventEnd")
.value||null,

created_by:
currentUser.id

});


if(result.error){

alert(result.error.message);

return;

}


closeModal();

loadEvents();

}


/* =================================
   MODAL
================================= */

function closeModal(){

$("modal").style.display="none";

modalType=null;

}


async function saveModal(){

if(modalType==="event"){

await saveEvent();

}

}


/* =================================
   LOGOUT
================================= */

async function logout(){

await db.auth.signOut();

currentUser=null;
currentMember=null;
currentFamily=null;

showLogin();

}


/* =================================
   SHOW LOGIN
================================= */

function showLogin(){

$("app").style.display="none";

$("auth").style.display="flex";

changeMode("login");

}


/* =================================
   AUTH STATE
================================= */

db.auth.onAuthStateChange(
function(event,session){

if(event==="SIGNED_OUT"){

showLogin();

}

});


/* =================================
   START
================================= */

(async function(){

const session=
await db.auth.getSession();


if(session.data.session){

currentUser=
session.data.session.user;

await loadAccount();

}else{

showLogin();

}

})();

</script>
