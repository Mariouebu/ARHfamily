<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>家族管理アプリ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Arial,"Noto Sans JP",sans-serif;
 background:#f3f6fb;
 color:#172033;
}

header{
 height:65px;
 background:white;
 border-bottom:1px solid #ddd;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 position:sticky;
 top:0;
 z-index:10;
}

.logo{
 font-weight:900;
 font-size:20px;
}

button{
 border:0;
 border-radius:10px;
 padding:11px 15px;
 cursor:pointer;
 font-weight:bold;
}

.logout{
 background:#edf1f7;
}

.layout{
 display:flex;
 min-height:calc(100vh - 65px);
}

nav{
 width:230px;
 background:#111827;
 padding:12px;
}

nav button{
 width:100%;
 margin-bottom:6px;
 text-align:left;
 background:transparent;
 color:white;
}

nav button:hover,
nav button.active{
 background:#334155;
}

main{
 flex:1;
 padding:24px;
 max-width:1300px;
}

.page{
 display:none;
}

.page.active{
 display:block;
}

.card{
 background:white;
 border-radius:18px;
 padding:20px;
 margin-bottom:18px;
 box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(210px,1fr));
 gap:15px;
}

.stat{
 font-size:30px;
 font-weight:900;
}

.field{
 margin-bottom:14px;
}

.field label{
 display:block;
 font-weight:bold;
 margin-bottom:6px;
}

input,textarea,select{
 width:100%;
 padding:11px;
 border:1px solid #d5ddea;
 border-radius:10px;
 font:inherit;
}

textarea{
 min-height:100px;
}

.primary{
 background:#536dfe;
 color:white;
}

.green{
 background:#16a34a;
 color:white;
}

.red{
 background:#dc2626;
 color:white;
}

.orange{
 background:#f59e0b;
 color:white;
}

.item{
 background:#f8fafc;
 border:1px solid #e1e7ef;
 padding:15px;
 border-radius:13px;
 margin-top:10px;
}

.itemTitle{
 font-weight:900;
 font-size:17px;
}

.meta{
 color:#687386;
 font-size:13px;
 margin-top:5px;
}

.amount{
 font-size:21px;
 font-weight:900;
 margin-top:8px;
}

.plus{
 color:#15803d;
}

.minus{
 color:#dc2626;
}

.hero{
 padding:25px;
 border-radius:20px;
 background:linear-gradient(135deg,#4f46e5,#8b5cf6);
 color:white;
 margin-bottom:18px;
}

.president{
 border:3px solid #f59e0b;
 background:#fffbeb;
}

.candidate{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:15px;
 border:1px solid #ddd;
 border-radius:13px;
 margin-top:10px;
}

.support{
 font-size:24px;
 font-weight:900;
}

.game{
 border-left:5px solid #6366f1;
}

.hidden{
 display:none!important;
}

.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 background:#eef2ff;
 color:#4338ca;
 font-size:12px;
 font-weight:bold;
}

@media(max-width:700px){

 .layout{
  flex-direction:column;
 }

 nav{
  width:100%;
  display:flex;
  overflow-x:auto;
 }

 nav button{
  min-width:130px;
  white-space:nowrap;
 }

 main{
  padding:13px;
 }

}

</style>

</head>

<body>

<header>

<div class="logo">
👨‍👩‍👧 家族管理
</div>

<div>

<span id="familyName"></span>

<button
class="logout"
onclick="logout()">

ログアウト

</button>

</div>

</header>


<div class="layout">

<nav>

<button class="active"
onclick="page('home',this)">
🏠 ホーム
</button>

<button
onclick="page('members',this)">
👨‍👩‍👧 家族
</button>

<button
id="childNav"
onclick="page('child',this)">
🧒 子どもページ
</button>

<button
id="parentNav"
onclick="page('parent',this)">
👨 親ページ
</button>

<button
onclick="page('games',this)">
🎮 今日のゲーム
</button>

<button
onclick="page('president',this)">
🗳️ 子ども大統領
</button>

</nav>


<main>


<!-- HOME -->

<section
id="home"
class="page active">

<h1>🏠 ホーム</h1>

<div class="grid">

<div class="card">

<h2>家族</h2>

<div
id="homeFamily"
class="stat">
</div>

</div>

<div class="card">

<h2>ログイン中</h2>

<div
id="homeUser"
class="stat">
</div>

<div id="homeRole"></div>

</div>

<div class="card">

<h2>🏆 子ども大統領</h2>

<div
id="homePresident"
class="stat">
未決定
</div>

</div>

</div>

</section>


<!-- MEMBERS -->

<section
id="members"
class="page">

<h1>👨‍👩‍👧 家族</h1>

<div class="card">

<div id="membersList"></div>

</div>

</section>


<!-- PARENT -->

<section
id="parent"
class="page">

<div class="hero">

<h1>👨 親ページ</h1>

<p>
家族全体を管理できます。
</p>

</div>

<div class="card">

<h2>📢 子どもページの管理</h2>

<div class="field">

<label>
ページタイトル
</label>

<input
id="childTitle">

</div>

<div class="field">

<label>
メッセージ
</label>

<textarea
id="childMessage"></textarea>

</div>

<button
class="primary"
onclick="saveChildPage()">

💾 子どもページを保存

</button>

</div>

</section>


<!-- CHILD -->

<section
id="child"
class="page">

<div
id="childHero"
class="hero">

<h1>🧒 子どもページ</h1>

<p id="childMessage"></p>

</div>


<div
id="presidentEdit"
class="card hidden">

<h2>🏆 子ども大統領</h2>

<p>
あなたは現在、支持率1位です。
</p>

<div class="field">

<label>
ページタイトル
</label>

<input id="presidentTitle">

</div>

<div class="field">

<label>
子どもページのメッセージ
</label>

<textarea id="presidentMessage"></textarea>

</div>

<button
class="primary orange"
onclick="savePresidentPage()">

✏️ 子どもページを編集

</button>

</div>


<div class="card">

<h2>🎮 今日のゲーム</h2>

<div id="childGames"></div>

</div>


</section>


<!-- GAMES -->

<section
id="games"
class="page">

<h1>🎮 今日のゲーム</h1>

<div
id="gameInput"
class="card">

<h2>➕ 今日やるゲームを登録</h2>

<div class="field">

<label>
ゲーム名
</label>

<input
id="gameName"
placeholder="例：マリオカート">

</div>

<div class="field">

<label>
開始時間
</label>

<input
id="gameTime"
type="time">

</div>

<button
class="primary"
onclick="addGame()">

🎮 登録する

</button>

</div>


<div class="card">

<h2>📋 今日の予定</h2>

<div id="gameList"></div>

</div>

</section>


<!-- PRESIDENT -->

<section
id="president"
class="page">

<h1>🗳️ 子ども大統領</h1>

<div class="card">

<h2>🏆 現在の子ども大統領</h2>

<div id="presidentWinner"></div>

</div>

<div
id="voteArea"
class="card">

<h2>🗳️ 投票</h2>

<p>
子どもは1人1票です。
</p>

<div id="candidateList"></div>

</div>

<div class="card">

<h2>📊 支持率</h2>

<div id="supportList"></div>

</div>

</section>


</main>

</div>


<script>


/* ===============================
 SUPABASE
================================ */

const SUPABASE_URL =
"https://cxwdndlbtdagvvcuvopm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qux36ew_JkABxzXCQEgW1A_ijJRoraO";

const db =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* ===============================
 STATE
================================ */

let user=null;

let member=null;

let family=null;

let members=[];

let votes=[];

let pageData=null;


/* ===============================
 UTIL
================================ */

function $(id){
 return document.getElementById(id);
}

function esc(x){
 return String(x ?? "")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}


/* ===============================
 PAGE
================================ */

function page(id,btn){

 document
 .querySelectorAll(".page")
 .forEach(x=>{
  x.classList.remove("active");
 });

 $(id).classList.add("active");

 document
 .querySelectorAll("nav button")
 .forEach(x=>{
  x.classList.remove("active");
 });

 btn.classList.add("active");

}


/* ===============================
 START
================================ */

async function start(){

 const session =
 await db.auth.getSession();

 if(!session.data.session){

  alert("ログインしてください。");

  return;

 }

 user =
 session.data.session.user;


 const m =
 await db
 .from("family_app_v2_members")
 .select("*")
 .eq("user_id",user.id)
 .maybeSingle();


 if(m.error){

  alert(m.error.message);

  return;

 }

 if(!m.data){

  alert(
   "このアカウントはまだ家族に参加していません。"
  );

  return;

 }


 member=m.data;


 const f =
 await db
 .from("family_app_v2_families")
 .select("*")
 .eq("id",member.family_id)
 .single();


 if(f.error){

  alert(f.error.message);

  return;

 }


 family=f.data;


 $("familyName").textContent =
 family.family_name;


 $("homeFamily").textContent =
 family.family_name;


 $("homeUser").textContent =
 member.name;


 $("homeRole").textContent =
 member.role==="parent"
 ? "👨 親"
 : "🧒 子ども";


 /*
  親と子どものページを分離
 */

 if(member.role==="parent"){

  $("childNav")
   .classList.add("hidden");

  $("parentNav")
   .classList.remove("hidden");

 }else{

  $("parentNav")
   .classList.add("hidden");

  $("childNav")
   .classList.remove("hidden");

 }


 await loadMembers();

 await loadChildPage();

 await loadGames();

 await loadPresident();

}


/* ===============================
 MEMBERS
================================ */

async function loadMembers(){

 const result =
 await db
 .from("family_app_v2_members")
 .select("*")
 .eq("family_id",family.id);


 if(result.error){

  console.error(result.error);

  return;

 }

 members=result.data || [];


 $("membersList").innerHTML =
 members.map(m=>`

 <div class="item">

  <div class="itemTitle">

   ${
    m.role==="parent"
    ? "👨 "
    : "🧒 "
   }

   ${esc(m.name)}

  </div>

  <div class="meta">

   ${
    m.role==="parent"
    ? "親"
    : "子ども"
   }

  </div>

 </div>

 `).join("");

}


/* ===============================
 CHILD PAGE
================================ */

async function loadChildPage(){

 const result =
 await db
 .from("family_app_v2_child_page")
 .select("*")
 .eq("family_id",family.id)
 .maybeSingle();


 if(result.error){

  console.error(result.error);

  return;

 }


 pageData=result.data;


 if(!pageData){

  /*
   最初のページ
  */

  const insert =
  await db
  .from("family_app_v2_child_page")
  .insert({

   family_id:family.id,

   title:"子どもページ",

   message:"みんなの子どもページです。"

  })
  .select()
  .single();


  if(!insert.error){

   pageData=insert.data;

  }

 }


 if(!pageData)
  return;


 $("childHero")
 .querySelector("h1")
 .textContent =
 pageData.title;


 $("childMessage").textContent =
 pageData.message;


 /*
  親なら親ページに情報を表示
 */

 if(member.role==="parent"){

  $("childTitle").value =
   pageData.title || "";

  $("childMessage").value =
   pageData.message || "";

 }


}


/* ===============================
 PARENT EDIT
================================ */

async function saveChildPage(){

 if(member.role!=="parent"){

  alert("親だけが編集できます。");

  return;

 }


 const title =
 $("childTitle").value.trim();

 const message =
 $("childMessage").value.trim();


 const result =
 await db
 .from("family_app_v2_child_page")
 .update({

  title:title || "子どもページ",

  message:message,

  updated_by:user.id,

  updated_at:new Date().toISOString()

 })
 .eq("family_id",family.id);


 if(result.error){

  alert(result.error.message);

  return;

 }


 alert("子どもページを更新しました。");

 await loadChildPage();

}


/* ===============================
 GAMES
================================ */

async function addGame(){

 if(member.role==="parent"){

  alert(
   "ゲーム予定は子どもページから子どもが登録できます。"
  );

  return;

 }


 const name =
 $("gameName").value.trim();

 const time =
 $("gameTime").value || null;


 if(!name){

  alert("ゲーム名を入力してください。");

  return;

 }


 const today =
 new Date()
 .toISOString()
 .slice(0,10);


 const result =
 await db
 .from("family_app_v2_game_schedule")
 .insert({

  family_id:family.id,

  member_id:member.id,

  game_name:name,

  game_time:time,

  game_date:today

 });


 if(result.error){

  alert(result.error.message);

  return;

 }


 $("gameName").value="";

 $("gameTime").value="";


 await loadGames();

 alert("今日のゲーム予定を登録しました！");

}


async function loadGames(){

 const today =
 new Date()
 .toISOString()
 .slice(0,10);


 const result =
 await db
 .from("family_app_v2_game_schedule")
 .select("*")
 .eq("family_id",family.id)
 .eq("game_date",today)
 .order("game_time");


 if(result.error){

  console.error(result.error);

  return;

 }


 const data=result.data || [];


 $("gameList").innerHTML =
 data.length
 ? data.map(g=>{

   const m=
   members.find(
    x=>x.id===g.member_id
   );


   return`

   <div class="item game">

    <div class="itemTitle">

     🧒 ${esc(
      m?.name || "子ども"
     )}

    </div>

    <div>

     🎮 ${esc(g.game_name)}

    </div>

    ${
     g.game_time
     ? `<div class="meta">
         ⏰ ${esc(g.game_time)}
        </div>`
     : ""
    }

    ${
     g.member_id===member.id
     ? `<button
          class="red"
          style="color:white;margin-top:10px"
          onclick="deleteGame('${g.id}')">
          削除
        </button>`
     : ""
    }

   </div>

   `;

  }).join("")
  : `<div class="meta">
      今日のゲーム予定はありません。
     </div>`;


 $("childGames").innerHTML =
 data.length
 ? data.map(g=>{

   const m=
   members.find(
    x=>x.id===g.member_id
   );

   return`

   <div class="item game">

    <b>
     🧒 ${esc(m?.name)}
    </b>

    <div>
     🎮 ${esc(g.game_name)}
    </div>

    ${
     g.game_time
     ? `<div class="meta">
        ⏰ ${esc(g.game_time)}
        </div>`
     :""
    }

   </div>

   `;

  }).join("")
  : `<div class="meta">
     今日のゲーム予定はありません。
     </div>`;

}


async function deleteGame(id){

 const result =
 await db
 .from("family_app_v2_game_schedule")
 .delete()
 .eq("id",id)
 .eq("member_id",member.id);


 if(result.error){

  alert(result.error.message);

  return;

 }


 await loadGames();

}


/* ===============================
 PRESIDENT
================================ */

async function loadPresident(){

 const children =
 members.filter(
  m=>m.role!=="parent"
 );


 if(!children.length){

  $("presidentWinner").innerHTML=
   `<div class="meta">
    子どもがまだいません。
    </div>`;

  $("candidateList").innerHTML="";

  $("supportList").innerHTML="";

  return;

 }


 const result =
 await db
 .from("family_app_v2_president_votes")
 .select("*")
 .eq("family_id",family.id);


 if(result.error){

  console.error(result.error);

  return;

 }


 votes=result.data || [];


 /*
  支持率計算
 */

 const counts={};

 children.forEach(c=>{
  counts[c.id]=0;
 });


 votes.forEach(v=>{

  if(counts[v.candidate_member_id]
     !==undefined){

   counts[v.candidate_member_id]++;

  }

 });


 const totalVotes =
 votes.length;


 const ranking =
 children
 .map(c=>({

  member:c,

  votes:counts[c.id] || 0,

  rate:
   totalVotes
   ? ((counts[c.id] || 0)
      /totalVotes*100)
   : 0

 }))
 .sort(
  (a,b)=>b.votes-a.votes
 );


 const winner =
 ranking[0];


 /*
  支持率1位
 */

 if(winner){

  $("homePresident").textContent =
   winner.member.name;


  $("presidentWinner").innerHTML=`

   <div class="candidate president">

    <div>

     <div class="itemTitle">
      🏆 ${esc(winner.member.name)}
     </div>

     <div class="meta">
      子ども大統領
     </div>

    </div>

    <div class="support">

     ${winner.rate.toFixed(1)}%

    </div>

   </div>

  `;


  /*
   支持率1位だけ編集可能
  */

  if(
   member.role!=="parent" &&
   member.id===winner.member.id
  ){

   $("presidentEdit")
    .classList.remove("hidden");

   $("presidentTitle").value =
    pageData?.title || "";

   $("presidentMessage").value =
    pageData?.message || "";

  }else{

   $("presidentEdit")
    .classList.add("hidden");

  }

 }


 /*
  子どもの投票
 */

 if(member.role==="parent"){

  $("voteArea")
   .classList.add("hidden");

 }else{

  $("voteArea")
   .classList.remove("hidden");


  const already =
   votes.find(
    v=>v.voter_member_id===member.id
   );


  $("candidateList").innerHTML =
   ranking.map(x=>`

   <div class="candidate">

    <div>

     <div class="itemTitle">
      🧒 ${esc(x.member.name)}
     </div>

     <div class="meta">
      支持率 ${x.rate.toFixed(1)}%
     </div>

    </div>

    <button
     class="primary"
     ${
      already
      ? "disabled"
      : ""
     }
     onclick="vote('${x.member.id}')">

     ${
      already
      ? (
       already.candidate_member_id===x.member.id
       ? "投票済み"
       : "投票済み"
      )
      : "この人に投票"
     }

    </button>

   </div>

   `).join("");

 }


 $("supportList").innerHTML =
 ranking.map((x,i)=>`

 <div class="candidate">

  <div>

   <b>
    ${i+1}位　
    ${esc(x.member.name)}
   </b>

   <div class="meta">
    ${x.votes}票
   </div>

  </div>

  <div class="support">

   ${x.rate.toFixed(1)}%

  </div>

 </div>

 `).join("");

}


async function vote(candidateId){

 if(member.role==="parent"){

  alert("投票できるのは子どもです。");

  return;

 }


 const existing =
 votes.find(
  v=>v.voter_member_id===member.id
 );


 if(existing){

  alert("すでに投票しています。");

  return;

 }


 const result =
 await db
 .from("family_app_v2_president_votes")
 .insert({

  family_id:family.id,

  voter_member_id:member.id,

  candidate_member_id:candidateId

 });


 if(result.error){

  alert(result.error.message);

  return;

 }


 alert("投票しました！");

 await loadPresident();

}


/* ===============================
 PRESIDENT EDIT
================================ */

async function savePresidentPage(){

 if(member.role==="parent"){

  alert("親は親ページから編集してください。");

  return;

 }


 /*
  現在の支持率1位か確認
 */

 const children =
 members.filter(
  m=>m.role!=="parent"
 );


 const count={};

 children.forEach(c=>{
  count[c.id]=0;
 });


 votes.forEach(v=>{

  if(count[v.candidate_member_id]
     !==undefined){

   count[v.candidate_member_id]++;

  }

 });


 const winner =
 children
 .slice()
 .sort(
  (a,b)=>
  (count[b.id]||0)-
  (count[a.id]||0)
 )[0];


 if(!winner ||
    winner.id!==member.id){

  alert(
   "支持率1位の子どもだけが編集できます。"
  );

  return;

 }


 const title =
 $("presidentTitle").value.trim();

 const message =
 $("presidentMessage").value.trim();


 const result =
 await db
 .from("family_app_v2_child_page")
 .update({

  title:title || "子どもページ",

  message:message,

  updated_by:user.id,

  updated_at:new Date().toISOString()

 })
 .eq("family_id",family.id);


 if(result.error){

  alert(result.error.message);

  return;

 }


 alert(
  "子ども大統領としてページを編集しました！"
 );


 await loadChildPage();

}
