<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族ホーム</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:#f3f6fb;
  color:#172033;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   AUTH
========================= */

#authPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:24px;
  padding:30px;
  box-shadow:0 15px 50px rgba(0,0,0,.10);
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:800;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#718096;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tabs button{
  flex:1;
  border:0;
  padding:12px;
  border-radius:12px;
  background:#edf1f7;
}

.tabs button.active{
  background:#315efb;
  color:white;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #d9e0ea;
  border-radius:12px;
  padding:12px 14px;
  background:white;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#315efb;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.primary{
  width:100%;
  border:0;
  padding:13px 18px;
  border-radius:12px;
  background:#315efb;
  color:white;
  font-weight:700;
}

.secondary{
  border:0;
  padding:9px 13px;
  border-radius:10px;
  background:#edf1f7;
}

.danger{
  border:0;
  padding:9px 13px;
  border-radius:10px;
  background:#ffe5e5;
  color:#d93025;
}

.small{
  font-size:13px;
  color:#718096;
}

.error{
  color:#d93025;
  margin-top:12px;
  white-space:pre-wrap;
}

.success{
  color:#16834a;
  margin-top:12px;
}

/* =========================
   APP
========================= */

#app{
  min-height:100vh;
}

.topbar{
  height:64px;
  background:white;
  border-bottom:1px solid #e3e8f0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:20;
}

.top-title{
  font-size:20px;
  font-weight:800;
}

.user-info{
  display:flex;
  align-items:center;
  gap:10px;
}

.role{
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  background:#edf1f7;
}

.role.parent{
  background:#fff0c2;
}

.role.child{
  background:#e3f1ff;
}

.logout{
  border:0;
  padding:8px 12px;
  border-radius:10px;
  background:#f0f2f5;
}

.layout{
  display:flex;
  min-height:calc(100vh - 64px);
}

.sidebar{
  width:230px;
  background:#fff;
  border-right:1px solid #e3e8f0;
  padding:15px;
}

.nav{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:12px;
  border-radius:12px;
  margin-bottom:5px;
  font-weight:600;
}

.nav:hover,
.nav.active{
  background:#edf2ff;
  color:#315efb;
}

.main{
  flex:1;
  padding:25px;
  max-width:1300px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  font-size:28px;
  margin:0 0 20px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.card h3{
  margin-top:0;
}

.item{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.item-title{
  font-size:18px;
  font-weight:800;
}

.item-meta{
  font-size:13px;
  color:#718096;
  margin-top:6px;
}

.item p{
  white-space:pre-wrap;
  line-height:1.7;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#edf1f7;
  font-size:12px;
  font-weight:700;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}

.empty{
  padding:30px;
  text-align:center;
  color:#718096;
}

.stat{
  font-size:32px;
  font-weight:800;
}

.stat-label{
  color:#718096;
}

.family-code{
  font-size:28px;
  font-weight:800;
  letter-spacing:4px;
  text-align:center;
  padding:15px;
  background:#f3f5f9;
  border-radius:14px;
}

/* =========================
   MODAL
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:20px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
}

.close{
  border:0;
  background:#edf1f7;
  width:36px;
  height:36px;
  border-radius:50%;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modal-actions button{
  flex:1;
}

/* =========================
   MOBILE
========================= */

.mobile-menu{
  display:none;
}

@media(max-width:800px){

  .layout{
    display:block;
  }

  .sidebar{
    position:fixed;
    left:-260px;
    top:64px;
    bottom:0;
    z-index:50;
    transition:.2s;
    box-shadow:10px 0 30px rgba(0,0,0,.1);
  }

  .sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:block;
    border:0;
    background:#edf1f7;
    border-radius:10px;
    padding:8px 12px;
    margin-right:10px;
  }

  .top-title{
    font-size:16px;
  }

  .main{
    padding:15px;
  }

  .page-title{
    font-size:23px;
  }

  .user-info .small{
    display:none;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     AUTH
===================================================== -->

<div id="authPage">

  <div class="auth-box">

    <div class="logo">
      👨‍👩‍👧 家族ホーム
    </div>

    <div class="subtitle">
      家族の予定・当番・法律・ニュースを管理
    </div>

    <div class="tabs">

      <button
        id="loginTab"
        class="active"
        onclick="showAuth('login')">

      </button>

      <button

    <!-- LOGIN -->

    <div id="loginForm">

      <div class="field">

        <input
          id="loginEmail"
          type="email"
          placeholder="example@email.com">

      </div>

      <div class="field">

        <label>パスワード</label>

        <input
          id="loginPassword"
          type="password"
          placeholder="パスワード">

      </div>

      <button
        class="primary"

    <!-- REGISTER -->

      <div class="field">

        <input
          id="registerName"
          placeholder="例：太郎">

      </div>

      <div class="field">

        <label>メールアドレス</label>

        <input
          id="registerEmail"
          type="email"
          placeholder="example@email.com">

      </div>

      <div class="field">

        <label>パスワード</label>

        <input
          id="registerPassword"
          type="password"
          placeholder="6文字以上">

      </div>

      <div class="field">

        <label>家族の作り方</label>

        <select id="familyMode">

          <option value="create">
            新しい家族を作る
          </option>

          <option value="join">

          </option>

        </select>

      </div>

      <div

        <label>家族名</label>

        <input
          id="registerFamilyName"

        <label>家族コード</label>

        <input
          id="registerFamilyCode"
          placeholder="家族から教えてもらったコード">

      </div>

      <button
        class="primary"
        onclick="register()">

        👤 登録する

      </button>

    </div>

    <div id="authMessage"></div>

  </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div

  class="hidden">

  <header class="topbar">

    <div style="display:flex;align-items:center;">

      <button
        class="mobile-menu"

      </button>

      <span

      </span>

        onclick="showPage('home',this)">

      <button

      <button

        class="nav"

      <button

      <button
        class="nav"

      </button>

      <button

        onclick="showPage('news',this)">

      </button>

    <!-- MAIN -->

    <main class="main">


      <!-- HOME -->

      <section

        <h1 class="page-title">

        <div class="grid">

            <div

            </div>

          </div>

          <div class="card">

            <h3>📋 当番</h3>

            <div

              class="stat">

      <!-- MESSAGES -->

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://cxwdndlbtdagvvcuvopm.supabase.co";

/*
  ここには、あなたがSupabaseから取得した
  Publishable / anon keyを入れてください。
*/
const SUPABASE_KEY =
  "ここにSupabaseのPublishable keyを入れる";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   STATE
===================================================== */

let currentUser = null;
let currentFamily = null;
let currentMember = null;

let currentForm = null;


/* =====================================================
   HELPER
===================================================== */

function $(id){
  return document.getElementById(id);
}


function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function isParent(){

  return currentMember &&
    currentMember.role === "parent";

}


function showMessage(text,type="error"){

  $("authMessage").className = type;
  $("authMessage").textContent = text;

}


function showToast(text){

  alert(text);

}


/* =====================================================
   AUTH TABS
===================================================== */

function showAuth(type){

  $("loginForm")
    .classList.toggle(
      "hidden",
      type !== "login"
    );

  $("registerForm")
    .classList.toggle(
      "hidden",
      type !== "register"
    );

  $("loginTab")
    .classList.toggle(
      "active",
      type === "login"
    );

  $("registerTab")
    .classList.toggle(
      "active",
      type === "register"
    );

  $("authMessage").textContent = "";

}


/* =====================================================
   FAMILY MODE
===================================================== */

$("familyMode").addEventListener(
  "change",
  function(){

    const join =
      this.value === "join";

    $("familyNameField")
      .classList.toggle(
        "hidden",
        join
      );

    $("familyCodeField")
      .classList.toggle(
        "hidden",
        !join
      );

  }
);


/* =====================================================
   REGISTER
===================================================== */

async function register(){

  const name =
    $("registerName")
      .value
      .trim();

  const email =
    $("registerEmail")
      .value
      .trim();

  const password =
    $("registerPassword")
      .value;

  const mode =
    $("familyMode").value;

  if(!name || !email || !password){

    showMessage(
      "名前・メールアドレス・パスワードを入力してください。"
    );

    return;
  }

  if(password.length < 6){

    showMessage(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }


  const {data,error} =
    await supabaseClient.auth.signUp({

      email,
      password,

      options:{
        data:{
          name:name
        }
      }

    });


  if(error){

    showMessage(error.message);
    return;

  }


  const user =
    data.user;

  if(!user){

    showMessage(
      "登録は完了しました。メール確認が必要な場合があります。",
      "success"
    );

    return;
  }


  /* ==========================================
     JOIN EXISTING FAMILY
  ========================================== */

  if(mode === "join"){

    const code =
      $("registerFamilyCode")
        .value
        .trim()
        .toUpperCase();

    if(!code){

      showMessage(
        "家族コードを入力してください。"
      );

      return;
    }


    const {data:family,error:familyError} =
      await supabaseClient
        .from("families")
        .select("*")
        .eq("family_code",code)
        .maybeSingle();


    if(familyError){

      showMessage(
        familyError.message
      );

      return;
    }


    if(!family){

      showMessage(
        "その家族コードの家族が見つかりません。"
      );

      return;
    }


    const {error:memberError} =
      await supabaseClient
        .from("family_members")
        .insert({

          family_id:family.id,

          user_id:user.id,

          name:name,

          role:"child"

        });


    if(memberError){

      showMessage(
        memberError.message
      );

      return;
    }


    await loadApp();

    return;

  }


  /* ==========================================
     CREATE FAMILY
  ========================================== */

  const familyName =
    $("registerFamilyName")
      .value
      .trim();


  if(!familyName){

    showMessage(
      "家族名を入力してください。"
    );

    return;
  }


  const familyCode =
    generateFamilyCode();


  const {data:family,error:familyError} =
    await supabaseClient
      .from("families")
      .insert({

        name:familyName,

        family_code:familyCode,

        created_by:user.id

      })
      .select()
      .single();


  if(familyError){

    showMessage(
      familyError.message
    );

    return;
  }


  const {error:memberError} =
    await supabaseClient
      .from("family_members")
      .insert({

        family_id:family.id,

        user_id:user.id,

        name:name,

        role:"parent"

      });


  if(memberError){

    showMessage(
      memberError.message
    );

    return;
  }


  await loadApp();

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    $("loginEmail")
      .value
      .trim();

  const password =
    $("loginPassword")
      .value;


  if(!email || !password){

    showMessage(
      "メールアドレスとパスワードを入力してください。"
    );

    return;
  }


  const {error} =
    await supabaseClient.auth.signInWithPassword({

      email,
      password

    });


  if(error){

    showMessage(
      error.message
    );

    return;
  }


  await loadApp();

}

async function logout(){

  await supabaseClient.auth.signOut();

  $("authPage")

}


/* =====================================================
   FAMILY CODE
===================================================== */

function generateFamilyCode(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for(let i=0;i<6;i++){

    code +=
      chars[
        Math.floor(
          Math.random()*chars.length
        )
      ];

  }

  return code;

}


/* =====================================================
   LOAD APP
===================================================== */

async function loadApp(){

  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    return;
  }


  currentUser = user;


  const {data:member,error} =
    await supabaseClient
      .from("family_members")
      .select("*")
      .eq("user_id",user.id)
      .maybeSingle();


  if(error){

    alert(
      "家族メンバー情報を取得できません。\n\n"+
      error.message
    );

    return;
  }


  if(!member){

    alert(
      "まだ家族に参加していません。"
    );

    return;
  }


  currentMember =
    member;


  const {data:family,error:familyError} =
    await supabaseClient
      .from("families")
      .select("*")
      .eq("id",member.family_id)
      .single();


  if(familyError){

    alert(
      "家族情報を取得できません。\n\n"+
      familyError.message
    );

    return;
  }


  currentFamily =
    family;


  $("authPage")
    .classList.add("hidden");

  $("app")
    .classList.remove("hidden");


  $("headerUserName")
    .textContent =
      member.name || user.email;


  $("headerRole")
    .textContent =
      member.role === "parent"
        ? "👑 親"
        : "🧒 子ども";


  $("headerRole")
    .classList.toggle(
      "parent",
      member.role === "parent"
    );

  $("headerRole")
    .classList.toggle(
    "child",
    member.role !== "parent"
  );


  $("homeFamilyName")
    .textContent =
      family.name;


  $("homeFamilyCode")
    .textContent =
      family.family_code;


  updatePermissionUI();

  await loadAll();

}

/* =====================================================
   PAGE
===================================================== */

function showPage(name,button){

  document
    .querySelectorAll(".page")
    .forEach(
      p => p.classList.remove("active")
    );


  $("page-"+name)
    .classList.add("active");


  document
    .querySelectorAll(".nav")
    .forEach(
      n => n.classList.remove("active")
    );


  if(button){

    button.classList.add("active");

  }


  $("sidebar")
    .classList.remove("open");

}


function toggleSidebar(){

  $("sidebar")
    .classList.toggle("open");

}

    await supabaseClient
      .from("family_duties")
      .select("*")

      )
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    $("dutiesList").innerHTML =
      `<div class="card">
        当番表がまだ設定されていません。
      </div>`;

    $("homeDuties")
      .textContent = "0";

    return;
  }


  $("homeDuties")
    .textContent =
      data?.length || 0;


  if(!data?.length){

    $("dutiesList").innerHTML =
      `<div class="card empty">
        まだ当番がありません。
      </div>`;

    return;
  }


  $("dutiesList").innerHTML =
    data.map(d => `

      <div class="item">

        <div class="item-title">
          📋 ${escapeHTML(d.title)}
        </div>

        <div class="item-meta">
          担当：${escapeHTML(d.assignee_name || "未設定")}
        </div>

        <div class="item-meta">
          ${escapeHTML(d.day || "")}
        </div>

        ${
          isParent()

                onclick="deleteDuty('${d.id}')">

                削除

              </button>

            </div>
          `
          : ""
        }

      </div>

    `).join("");

}

          n.source_url
          ? `
            <div class="actions">

              <a
                href="${escapeHTML(n.source_url)}"
                target="_blank"
                rel="noopener noreferrer">

                🔗 情報源を見る

              </a>

            </div>
          `
          : ""
        }

        ${
          isParent()
          ? `
            <div class="actions">

              <button
                class="danger"
                onclick="deleteNews('${n.id}')">

                🗑️ 削除

              </button>

            </div>
          `
          : ""
        }

      </div>

    `).join("");

}


function openNewsModal(){

  if(!isParent()){

    alert("親だけが追加できます。");
    return;

  }


  currentForm = "news";

  $("modalTitle")
    .textContent =
      "📰 家族ニュースを追加";


  $("modalContent").innerHTML = `

    <div class="field">

      <label>タイトル</label>

      <input
        id="newsTitle"
        placeholder="例：学校からのお知らせ">

    </div>

    <div class="field">

      <label>カテゴリー</label>

      <select id="newsCategory">

        <option value="家族ニュース">
          👨‍👩‍👧 家族ニュース
        </option>

        <option value="学校">
          🏫 学校
        </option>

        <option value="地域">
          🏘️ 地域
        </option>

        <option value="重要">
          🚨 重要
        </option>

      </select>

    </div>

    <div class="field">

      <label>内容</label>

      <textarea
        id="newsBody"
        placeholder="ニュース内容">
      </textarea>

    </div>

    <div class="field">

      <label>出典</label>

      <input
        id="newsSource"
        placeholder="例：学校・自治体">

    </div>

    <div class="field">

      <label>情報源URL</label>

      <input
        id="newsSourceUrl"
        type="url"
        placeholder="https://...">

    </div>

  `;

  openModal();

}


async function saveNews(){

  const title =
    $("newsTitle")
      .value
      .trim();

  const body =
    $("newsBody")
      .value
      .trim();


  if(!title || !body){

    alert(
      "タイトルと内容を入力してください。"
    );

    return;

  }


  const {error} =
    await supabaseClient
      .from("family_news")
      .insert({

        family_id:
          currentFamily.id,

        title:title,

        body:body,

        category:
          $("newsCategory").value,

        source:
          $("newsSource")
            .value
            .trim(),

        source_url:
          $("newsSourceUrl")
            .value
            .trim(),

        created_by:
          currentUser.id

      });


  if(error){

    alert(error.message);
    return;

  }


  closeModal();

  await loadNews();

}


async function deleteNews(id){

  if(!isParent()) return;


  if(!confirm(
    "このニュースを削除しますか？"
  )){

    return;

  }


  const {error} =
    await supabaseClient
      .from("family_news")
      .delete()
      .eq("id",id);


  if(error){

    alert(error.message);
    return;

  }


  await loadNews();

}


/* =====================================================
   MEMBERS
===================================================== */

async function loadMembers(){

  const {data,error} =
    await supabaseClient
      .from("family_members")
      .select("*")
      .eq(
        "family_id",
        currentFamily.id
      );


  if(error){

    $("membersList").innerHTML =
      `<div class="card">
        メンバーを取得できません。
      </div>`;

    return;

  }


  $("membersList").innerHTML =
    data.map(m => `

      <div class="item">

        <div class="item-title">

          ${
            m.role === "parent"
              ? "👑"
              : "🧒"
          }

          ${escapeHTML(m.name || "名前なし")}

        </div>

        <div class="item-meta">

          ${
            m.role === "parent"
              ? "親"
              : "子ども"
          }

        </div>

      </div>

    `).join("");

}


/* =====================================================
   MODAL
===================================================== */

function openModal(){

  $("modalBg")
    .classList.add("show");

}


function closeModal(){

  $("modalBg")
    .classList.remove("show");

  currentForm = null;

}


async function saveModal(){

  if(currentForm === "duty"){

    await saveDuty();
    return;

  }


  if(currentForm === "task"){

    await saveTask();
    return;

  }


  if(currentForm === "event"){

    await saveEvent();
    return;

  }


  if(currentForm === "message"){

    await saveMessage();
    return;

  }


  if(currentForm === "law"){

    await saveLaw();
    return;

  }


  if(currentForm === "news"){

    await saveNews();
    return;

  }

}

   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  async (event,session) => {

    if(session?.user){

      await loadApp();

    }

  }
);

  const {
    data:{
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if(session?.user){

    await loadApp();

  }

})();

</script>
