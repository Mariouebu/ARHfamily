<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族ホーム</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:#f4f7fb;
  color:#172033;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.primary{
  background:#536dfe;
  color:white;
  border:0;
  border-radius:12px;
  padding:12px 17px;
  font-weight:bold;
}

.gray{
  background:#e9edf5;
  border:0;
  border-radius:12px;
  padding:12px 17px;
}

.green{
  background:#16a34a;
  color:white;
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-weight:bold;
}

.danger{
  background:#ef4444;
  color:white;
  border:0;
  border-radius:9px;
  padding:8px 12px;
}

/* =========================
   AUTH
========================= */

#auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#5578ff,#8b5cf6);
}

.authBox{
  width:100%;
  max-width:540px;
  background:white;
  padding:30px;
  border-radius:25px;
  box-shadow:0 20px 70px #0004;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
}

.sub{
  text-align:center;
  color:#6b7280;
}

.authTabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:22px 0;
}

.authTabs button{
  border:0;
  background:#edf1f7;
  padding:11px 5px;
  border-radius:10px;
  font-weight:bold;
}

.authTabs button.active{
  background:#536dfe;
  color:white;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid #d7deea;
  border-radius:10px;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#536dfe;
}

.field textarea{
  min-height:100px;
}

.authError{
  color:#dc2626;
  font-weight:bold;
  margin-top:14px;
}

.authSuccess{
  color:#15803d;
  background:#f0fdf4;
  padding:12px;
  border-radius:10px;
  margin-top:14px;
}

/* =========================
   APP
========================= */

#app{
  display:none;
}

header{
  height:68px;
  background:white;
  border-bottom:1px solid #e3e8f0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:20;
}

.headerTitle{
  font-size:21px;
  font-weight:900;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:10px;
}

.badge{
  padding:7px 12px;
  background:#eef2ff;
  color:#4f46e5;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.layout{
  display:flex;
  min-height:calc(100vh - 68px);
}

nav{
  width:240px;
  background:#111827;
  padding:13px;
  flex-shrink:0;
}

nav button{
  width:100%;
  display:block;
  background:transparent;
  border:0;
  color:#dbe3ef;
  text-align:left;
  padding:12px;
  border-radius:10px;
  margin-bottom:4px;
  font-weight:bold;
}

nav button.active,
nav button:hover{
  background:#293548;
  color:white;
}

main{
  width:100%;
  max-width:1450px;
  padding:24px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:18px;
  padding:19px;
  margin-bottom:16px;
  box-shadow:0 3px 15px #26344a0c;
}

.item{
  background:#f8fafc;
  border:1px solid #e3e8f0;
  padding:14px;
  border-radius:13px;
  margin-top:10px;
}

.itemTitle{
  font-size:17px;
  font-weight:900;
}

.meta{
  color:#6b7280;
  font-size:13px;
  margin-top:6px;
}

.stat{
  font-size:28px;
  font-weight:900;
}

.empty{
  text-align:center;
  padding:20px;
  color:#7b8495;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.successBox{
  background:#ecfdf5;
  border:1px solid #bbf7d0;
  padding:15px;
  border-radius:13px;
}

.warning{
  background:#fff7ed;
  border:1px solid #fed7aa;
  padding:12px;
  border-radius:12px;
}

/* calendar */

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.day{
  min-height:80px;
  background:#f8fafc;
  border:1px solid #e3e8f0;
  border-radius:8px;
  padding:6px;
}

.eventMini{
  background:#e0e7ff;
  color:#3730a3;
  border-radius:5px;
  padding:3px;
  font-size:11px;
  margin-top:4px;
}

/* modal */

#modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modalBox{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:20px;
  padding:22px;
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  border:0;
  width:36px;
  height:36px;
  border-radius:50%;
  background:#edf1f6;
  font-size:20px;
}

@media(max-width:800px){

nav{
  width:68px;
}

nav button{
  font-size:0;
  text-align:center;
}

main{
  padding:13px;
}

.authTabs{
  grid-template-columns:1fr;
}

}
</style>
</head>

<body>


<!-- =====================================================
     AUTH
===================================================== -->

<div id="auth">

<div class="authBox">

<div class="logo">
👨‍👩‍👧 家族ホーム
</div>

<p class="sub">
家族専用管理アプリ
</p>


<div class="authTabs">

<button id="loginTab"
onclick="authMode('login')">
🔐 ログイン
</button>

<button id="createTab"
onclick="authMode('create')">
🏠 家族を作る
</button>

<button id="joinTab"
onclick="authMode('join')">
👨‍👩‍👧 参加
</button>

</div>


<!-- =========================
     LOGIN
========================= -->

<div id="loginForm">

<div class="field">
<label>メールアドレス</label>
<input
id="loginEmail"
type="email"
autocomplete="email"
placeholder="example@email.com">
</div>

<div class="field">
<label>パスワード</label>
<input
id="loginPassword"
type="password"
autocomplete="current-password">
</div>

<button
class="primary"
style="width:100%"
onclick="login()">
🔐 ログイン
</button>

</div>


<!-- =========================
     CREATE FAMILY
========================= -->

<div id="createForm" class="hidden">

<div class="field">
<label>家族名</label>
<input
id="createFamilyName"
placeholder="例：山田家">
</div>

<div class="field">
<label>あなたの名前</label>
<input
id="createName"
placeholder="例：お父さん">
</div>

<div class="field">
<label>メールアドレス</label>
<input
id="createEmail"
type="email"
autocomplete="email">
</div>

<div class="field">
<label>パスワード</label>
<input
id="createPassword"
type="password"
autocomplete="new-password">
</div>

<button
class="primary"
style="width:100%"
onclick="createFamily()">
🏠 家族を作って登録
</button>

</div>


<!-- =========================
     JOIN FAMILY
========================= -->

<div id="joinForm" class="hidden">

<div class="field">
<label>家族コード</label>
<input
id="joinFamilyCode"
placeholder="例：A1B2C3D4">
</div>

<div class="field">
<label>あなたの名前</label>
<input
id="joinName"
placeholder="例：太郎">
</div>

<div class="field">
<label>メールアドレス</label>
<input
id="joinEmail"
type="email"
autocomplete="email">
</div>

<div class="field">
<label>パスワード</label>
<input
id="joinPassword"
type="password"
autocomplete="new-password">
</div>

<div class="field">

<label>参加する立場</label>

<select id="joinRole">

<option value="child">
🧒 子ども
</option>

<option value="parent">
👨‍👩‍👧 親
</option>

</select>

</div>


<div class="field">

<label>
親の場合：親招待コード
</label>

<input
id="parentInvite"
placeholder="PARENT-XXXXXXXX">

</div>


<button
class="primary"
style="width:100%"
onclick="joinFamily()">
👨‍👩‍👧 家族に参加
</button>

</div>


<div id="authError" class="authError"></div>

<div id="authSuccess" class="authSuccess hidden"></div>

</div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div id="app">

<header>

<div class="headerTitle">
👨‍👩‍👧 家族ホーム
</div>

<div class="headerRight">

<span id="familyNameHeader"></span>

<span id="roleBadge" class="badge"></span>

<button
class="gray"
onclick="logout()">
ログアウト
</button>

</div>

</header>


<div class="layout">

<nav>

<button
class="active"
onclick="showPage('home',this)">
🏠 ホーム
</button>

<button
onclick="showPage('members',this)">
👨‍👩‍👧 メンバー
</button>

<button
onclick="showPage('calendar',this)">
📅 カレンダー
</button>

<button
onclick="showPage('children',this)">
🧒 子どもページ
</button>

<button
onclick="showPage('president',this)">
🗳️ 大統領
</button>

</nav>


<main>


<!-- HOME -->

<section
id="page-home"
class="page active">

<h1>🏠 家族ホーム</h1>

<div class="grid">

<div class="card">

<h2>👨‍👩‍👧 家族</h2>

<div id="homeFamily"></div>

</div>


<div class="card">

<h2>📅 今日の予定</h2>

<div id="todayEvents"></div>

</div>


<div class="card">

<h2>👑 大統領</h2>

<div id="homePresident"></div>

</div>

</div>

</section>


<!-- MEMBERS -->

<section
id="page-members"
class="page">

<h1>👨‍👩‍👧 家族メンバー</h1>

<div class="card">

<div id="memberList"></div>

</div>


<div
id="parentInviteCard"
class="card">

<h2>👨‍👩‍👧 親を追加</h2>

<p>
親が招待コードを発行できます。
</p>

<button
class="primary"
onclick="createParentInvite()">
＋ 親招待コードを発行
</button>

<div id="inviteResult"></div>

</div>

</section>


<!-- CALENDAR -->

<section
id="page-calendar"
class="page">

<h1>📅 家族カレンダー</h1>

<div class="card">

<div class="actions">

<button
class="primary"
onclick="openEventModal()">
＋ 予定を追加
</button>

<button
class="gray"
onclick="downloadICS()">
📥 カレンダーに追加
</button>

</div>

<div
id="calendarBox"
style="margin-top:20px">
</div>

</div>


<div class="card">

<h2>📋 予定一覧</h2>

<div id="eventList"></div>

</div>

</section>


<!-- CHILDREN -->

<section
id="page-children"
class="page">

<h1>🧒 子どもページ</h1>


<div class="card">

<h2>📰 子どもニュース</h2>

<div id="childNewsList"></div>

<div id="childEditorButtons"></div>

</div>


<div class="card">

<h2>🎮 ゲーム予定</h2>

<div id="gameList"></div>

<div id="gameEditorButtons"></div>

</div>


<div class="card">

<h2>🚨 違反記録</h2>

<div id="violationList"></div>

<div id="violationButtons"></div>

</div>


<div class="card">

<h2>📢 子どもページのお知らせ</h2>

<div id="childPageList"></div>

<div id="childPageButtons"></div>

</div>

</section>


<!-- PRESIDENT -->

<section
id="page-president"
class="page">

<h1>🗳️ 子ども大統領</h1>


<div class="card">

<h2>👑 現在の大統領</h2>

<div id="presidentBox"></div>

</div>


<div class="card">

<h2>📊 候補者・支持率</h2>

<div id="candidateList"></div>

</div>


<div
id="candidateAddBox"
class="card">

<h2>候補者を登録</h2>

<button
class="primary"
onclick="openCandidateModal()">
＋ 候補者を追加
</button>

</div>

</section>

</main>

</div>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div id="modal">

<div class="modalBox">

<div class="modalHead">

<h2 id="modalTitle"></h2>

<button
class="close"
onclick="closeModal()">
×
</button>

</div>

<div id="modalContent"></div>

<div class="actions">

<button
class="primary"
onclick="saveModal()">
保存
</button>

<button
class="gray"
onclick="closeModal()">
キャンセル
</button>

</div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://cxwdndlbtdagvvcuvopm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qux36ew_JkABxzXCQEgW1A_ijJRoraO";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   STATE
===================================================== */

let user=null;
let family=null;
let member=null;
let modalType=null;


/* =====================================================
   HELPERS
===================================================== */

function $(id){
return document.getElementById(id);
}

function esc(v){
return String(v ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#39;");
}

function isParent(){
return member?.role==="parent";
}

function isPresident(){
return member?.role==="president";
}

function isEditor(){
return isParent() || isPresident();
}


/* =====================================================
   AUTH MODE
===================================================== */

function authMode(mode){

$("loginForm")
.classList.toggle(
"hidden",
mode!=="login"
);

$("createForm")
.classList.toggle(
"hidden",
mode!=="create"
);

$("joinForm")
.classList.toggle(
"hidden",
mode!=="join"
);

$("loginTab")
.classList.toggle(
"active",
mode==="login"
);

$("createTab")
.classList.toggle(
"active",
mode==="create"
);

$("joinTab")
.classList.toggle(
"active",
mode==="join"
);

$("authError").textContent="";
$("authSuccess").classList.add("hidden");

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

$("authError").textContent="";
$("authSuccess").classList.add("hidden");

const email=
$("loginEmail").value.trim();

const password=
$("loginPassword").value;

if(!email || !password){

$("authError").textContent=
"メールアドレスとパスワードを入力してください。";

return;
}

const {data,error} =
await db.auth.signInWithPassword({
email:email,
password:password
});

if(error){

$("authError").textContent=
"ログインできませんでした："+
error.message;

return;
}

user=data.user;

await loadUser();

}


/* =====================================================
   CREATE FAMILY
===================================================== */

async function createFamily(){

$("authError").textContent="";

const familyName=
$("createFamilyName").value.trim();

const name=
$("createName").value.trim();

const email=
$("createEmail").value.trim();

const password=
$("createPassword").value;

if(
!familyName ||
!name ||
!email ||
!password
){

$("authError").textContent=
"全部入力してください。";

return;
}

if(password.length<6){

$("authError").textContent=
"パスワードは6文字以上にしてください。";

return;
}


const {data,error} =
await db.auth.signUp({
email,
password
});

if(error){

$("authError").textContent=
error.message;

return;
}


/*
  メール確認がONの場合
*/

if(!data.session){

$("authSuccess").classList.remove("hidden");

$("authSuccess").innerHTML=
"登録しました。<br>" +
"確認メールが届いている場合は、メールを確認してからログインしてください。";

return;
}


user=data.user;


const {data:result,error:rpcError} =
await db.rpc(
"family_app_v2_create_family",
{
p_family_name:familyName,
p_name:name
}
);

if(rpcError){

$("authError").textContent=
rpcError.message;

return;
}


alert(
"家族を作成しました！\n\n"+
"家族コード："+
result.family_code+
"\n\n"+
"親招待コード："+
result.parent_invite_code
);

await loadUser();

}


/* =====================================================
   JOIN FAMILY
===================================================== */

async function joinFamily(){

$("authError").textContent="";

const code=
$("joinFamilyCode").value.trim();

const name=
$("joinName").value.trim();

const email=
$("joinEmail").value.trim();

const password=
$("joinPassword").value;

const role=
$("joinRole").value;

const invite=
$("parentInvite").value.trim();


if(
!code ||
!name ||
!email ||
!password
){

$("authError").textContent=
"全部入力してください。";

return;
}


if(password.length<6){

$("authError").textContent=
"パスワードは6文字以上にしてください。";

return;
}


if(role==="parent" && !invite){

$("authError").textContent=
"親として参加する場合は親招待コードを入力してください。";

return;
}


const {data,error} =
await db.auth.signUp({
email,
password
});

if(error){

$("authError").textContent=
error.message;

return;
}


if(!data.session){

$("authSuccess").classList.remove("hidden");

$("authSuccess").innerHTML=
"登録しました。<br>"+
"確認メールが届いている場合は、メール確認後にログインしてください。";

return;
}


user=data.user;


if(role==="parent"){

const {data:result,error} =
await db.rpc(
"family_app_v2_join_as_parent",
{
p_invite_code:invite,
p_name:name
}
);

if(error){

$("authError").textContent=
error.message;

return;
}

}else{

const {data:result,error} =
await db.rpc(
"family_app_v2_join_family",
{
p_family_code:code,
p_name:name,
p_role:"child"
}
);

if(error){

$("authError").textContent=
error.message;

return;
}

}


await loadUser();

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser(){

const {data}=
await db.auth.getSession();

if(!data.session){

showLogin();

return;
}

user=data.session.user;


const {data:members,error} =
await db
.from("family_app_v2_members")
.select("*")
.eq("user_id",user.id);


if(error){

alert(error.message);
return;

}


if(!members || members.length===0){

showLogin();

$("authError").textContent=
"このアカウントには家族が登録されていません。";

return;
}


member=members[0];


const {data:families,error:familyError} =
await db
.from("family_app_v2_families")
.select("*")
.eq("id",member.family_id)
.single();


if(familyError){

alert(familyError.message);
return;

}


family=families;

openApp();

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

$("app").style.display="none";
$("auth").style.display="flex";

authMode("login");

}


/* =====================================================
   OPEN APP
===================================================== */

function openApp(){

$("auth").style.display="none";
$("app").style.display="block";

$("familyNameHeader").textContent=
family.family_name;

$("roleBadge").textContent=
isParent()
?"👨‍👩‍👧 親"
:
isPresident()
?"👑 子ども大統領"
:
"🧒 子ども";


$("parentInviteCard")
.classList.toggle(
"hidden",
!isParent()
);

loadHome();
loadMembers();
loadEvents();
loadChildren();
loadPresident();

}


/* =====================================================
   NAV
===================================================== */

function showPage(name,button){

document
.querySelectorAll(".page")
.forEach(x=>
x.classList.remove("active")
);

$("page-"+name)
.classList.add("active");


document
.querySelectorAll("nav button")
.forEach(x=>
x.classList.remove("active")
);

button.classList.add("active");

}


/* =====================================================
   HOME
===================================================== */

async function loadHome(){

function renderCalendar(events){

const now=new Date();

const year=now.getFullYear();
const month=now.getMonth();

const first=
new Date(year,month,1);

const last=
new Date(year,month+1,0);


let html=`

<div style="font-weight:900;margin-bottom:10px">
${year}年 ${month+1}月
</div>

<div class="calendar">
`;


for(
let i=0;
i<first.getDay();
i++
){

html+=`<div></div>`;

}


for(
let day=1;
day<=last.getDate();
day++
){

const date=
`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

const todays=
events.filter(
e=>e.event_date===date
);


html+=`

<div class="day">

<strong>
${day}
</strong>

${
todays.map(e=>`

<div class="eventMini">
${esc(e.title)}
</div>

`).join("")
}

</div>

`;

}


html+=`</div>`;

$("calendarBox").innerHTML=html;

}

/* =====================================================
   ICS
===================================================== */

function icsDate(date,time){

return (
date+
"T"+
(time||"00:00")+
":00"
)
.replace(/[-:]/g,"");

}


function downloadOneICS(e){

const start=
icsDate(
e.event_date,
e.start_time
);

const end=
icsDate(
e.event_date,
e.end_time||e.start_time
);


const text=
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//FamilyHome//JP
BEGIN:VEVENT
UID:${e.id}@familyhome
DTSTART:${start}
DTEND:${end}
SUMMARY:${(e.title||"").replace(/\n/g," ")}
DESCRIPTION:${(e.description||"").replace(/\n/g," ")}
END:VEVENT
END:VCALENDAR`;


const blob=
new Blob(
[text],
{
type:"text/calendar;charset=utf-8"
}
);


const url=
URL.createObjectURL(blob);


const a=
document.createElement("a");

a.href=url;

a.download=
(e.title||"family-event")+".ics";

a.click();

URL.revokeObjectURL(url);

}


async function downloadICS(){

const {data}=
await db
.from("family_app_v2_events")
.select("*")
.eq("family_id",family.id);


if(!data?.length){

alert("予定がありません");
return;

}


const parts=[
"BEGIN:VCALENDAR",
"VERSION:2.0",
"PRODID:-//FamilyHome//JP"
];


data.forEach(e=>{

parts.push("BEGIN:VEVENT");

parts.push(
"UID:"+e.id+"@familyhome"
);

parts.push(
"DTSTART:"+
icsDate(
e.event_date,
e.start_time
)
);

parts.push(
"DTEND:"+
icsDate(
e.event_date,
e.end_time||e.start_time
)
);

parts.push(
"SUMMARY:"+
(e.title||"").replace(/\n/g," ")
);

parts.push("END:VEVENT");

});


parts.push("END:VCALENDAR");


const blob=
new Blob(
[parts.join("\r\n")],
{
type:"text/calendar;charset=utf-8"
}
);


const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"家族カレンダー.ics";

a.click();

URL.revokeObjectURL(url);

}
