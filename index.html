<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族ホーム</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:#f4f7fb;
  color:#172033;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   認証
========================= */

#auth{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#4f6df5,#8b5cf6);
}

.authBox{
  width:100%;
  max-width:520px;
  background:#fff;
  padding:30px;
  border-radius:24px;
  box-shadow:0 20px 60px #0004;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
}

.subtitle{
  text-align:center;
  color:#687386;
  margin:8px 0 25px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:20px;
}

.tabs button{
  border:0;
  padding:11px 5px;
  border-radius:10px;
  background:#edf1f7;
}

.tabs button.active{
  background:#536dfe;
  color:#fff;
  font-weight:bold;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:12px;
  border:1px solid #d6ddea;
  border-radius:10px;
  outline:none;
}

.primary{
  width:100%;
  padding:13px;
  border:0;
  border-radius:11px;
  background:#536dfe;
  color:#fff;
  font-weight:bold;
}

.secondary{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  background:#edf1f7;
}

.error{
  margin-top:15px;
  padding:12px;
  background:#fff1f2;
  color:#be123c;
  border-radius:10px;
  white-space:pre-wrap;
}

.success{
  margin-top:15px;
  padding:12px;
  background:#ecfdf5;
  color:#166534;
  border-radius:10px;
}

/* =========================
   アプリ
========================= */

#app{
  display:none;
}

header{
  height:65px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:10;
}

.headerTitle{
  font-size:20px;
  font-weight:900;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:8px;
}

.badge{
  padding:7px 12px;
  background:#eef2ff;
  color:#4338ca;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.logout{
  border:0;
  background:#edf1f7;
  border-radius:9px;
  padding:9px 12px;
}

.layout{
  display:flex;
  min-height:calc(100vh - 65px);
}

nav{
  width:220px;
  background:#111827;
  padding:12px;
}

nav button{
  display:block;
  width:100%;
  border:0;
  background:transparent;
  color:#dbe3ef;
  padding:12px;
  border-radius:9px;
  text-align:left;
  margin-bottom:4px;
}

nav button.active,
nav button:hover{
  background:#293548;
  color:#fff;
}

main{
  flex:1;
  padding:25px;
  max-width:1400px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:#fff;
  border-radius:17px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 15px #0000000b;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.item{
  padding:14px;
  margin-top:10px;
  background:#f8fafc;
  border:1px solid #e1e7ef;
  border-radius:12px;
}

.itemTitle{
  font-size:17px;
  font-weight:900;
}

.meta{
  margin-top:5px;
  color:#687386;
  font-size:13px;
}

.stat{
  font-size:28px;
  font-weight:900;
}

.empty{
  text-align:center;
  color:#7b8495;
  padding:20px;
}

.successBox{
  background:#ecfdf5;
  border:1px solid #bbf7d0;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
}

@media(max-width:700px){

  .layout{
    flex-direction:column;
  }

  nav{
    width:100%;
    display:flex;
    overflow-x:auto;
  }

  nav button{
    min-width:120px;
  }

  main{
    padding:13px;
  }

  header{
    padding:0 10px;
  }

  .headerTitle{
    font-size:16px;
  }

  .badge{
    display:none;
  }

}
</style>
</head>

<body>

<script>

/* =====================================
   Supabase設定
===================================== */

const SUPABASE_URL =
"https://cxwdndlbtdagvvcuvopm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qux36ew_JkABxzXCQEgW1A_ijJRoraO";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   状態
===================================== */

let user = null;
let member = null;
let family = null;


/* =====================================
   共通
===================================== */

function $(id){
  return document.getElementById(id);
}


function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showMessage(text,type="error"){

  const box=$("message");

  box.className =
    type==="success"
    ? "success"
    : "error";

  box.textContent=text;

}


function clearMessage(){

  $("message").className="error hidden";
  $("message").textContent="";

}


/* =====================================
   モード切替
===================================== */

function mode(type){

  clearMessage();

  $("loginBox")
    .classList
    .toggle("hidden",type!=="login");

  $("createBox")
    .classList
    .toggle("hidden",type!=="create");

  $("joinBox")
    .classList
    .toggle("hidden",type!=="join");

  $("loginTab")
    .classList
    .toggle("active",type==="login");

  $("createTab")
    .classList
    .toggle("active",type==="create");

  $("joinTab")
    .classList
    .toggle("active",type==="join");

}


$("joinRole").addEventListener(
"change",
function(){

  $("parentInviteArea")
    .classList
    .toggle(
      "hidden",
      this.value!=="parent"
    );

});


/* =====================================
   ログイン
===================================== */

async function login(){

  clearMessage();

  const email=
    $("loginEmail").value.trim();

  const password=
    $("loginPassword").value;

  if(!email || !password){

    showMessage(
      "メールアドレスとパスワードを入力してください。"
    );

    return;
  }


  const result=
    await supabaseClient.auth.signInWithPassword({

      email,
      password

    });


  if(result.error){

    showMessage(
      "ログインできませんでした。\n\n"+
      result.error.message
    );

    return;
  }


  user=result.data.user;

  await loadUserFamily();

}


/* =====================================
   家族情報取得
===================================== */

async function loadUserFamily(){

  try{

    const sessionResult=
      await supabaseClient.auth.getSession();

    if(sessionResult.error){

      showMessage(
        "認証情報を取得できませんでした。\n\n"+
        sessionResult.error.message
      );

      return;
    }


    const session=
      sessionResult.data.session;


    if(!session){

      showLogin();

      return;
    }


    user=session.user;


    /*
     * ここでは
     *
     * family_app_v2_members
     *
     * を直接SELECTするだけ。
     *
     * 家族全員を取得するRLSを
     * 使わないので、
     * 無限再帰ポリシーの影響を
     * 受けにくい構成。
     */

    const result=
      await supabaseClient
        .from("family_app_v2_members")
        .select(
          "id,family_id,user_id,name,role,created_at"
        )
        .eq(
          "user_id",
          user.id
        )
        .maybeSingle();


    if(result.error){

      showMessage(
        "ログインは成功しましたが、"+
        "家族情報の取得に失敗しました。\n\n"+
        result.error.message+
        "\n\n"+
        "Supabase SQL EditorでRLS修正版SQLを実行してください。"
      );

      return;
    }


    if(!result.data){

      $("app").style.display="none";
      $("auth").style.display="flex";

      mode("join");

      showMessage(
        "ログインは成功しました。\n\n"+
        "このアカウントはまだ家族に参加していません。\n"+
        "「家族参加」から家族コードを入力してください。",
        "success"
      );

      return;
    }


    member=result.data;


    /*
     * 家族情報取得
     */

    const familyResult=
      await supabaseClient
        .from("family_app_v2_families")
        .select("*")
        .eq("id",member.family_id)
        .maybeSingle();


    if(familyResult.error){

      showMessage(
        "家族情報の取得に失敗しました。\n\n"+
        familyResult.error.message
      );

      return;
    }


    if(!familyResult.data){

      showMessage(
        "家族情報が見つかりません。\n\n"+
        "family_id:\n"+
        member.family_id
      );

      return;
    }


    family=familyResult.data;


    openApp();

  }catch(error){

    showMessage(
      "予期しないエラーが発生しました。\n\n"+
      error.message
    );

  }

}


/* =====================================
   新規登録
===================================== */

async function register(){

  clearMessage();

  const familyName=
    $("newFamilyName").value.trim();

  const name=
    $("newName").value.trim();

  const email=
    $("newEmail").value.trim();

  const password=
    $("newPassword").value;


  if(
    !familyName ||
    !name ||
    !email ||
    !password
  ){

    showMessage(
      "すべて入力してください。"
    );

    return;
  }


  if(password.length<6){

    showMessage(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }


  const result=
    await supabaseClient.auth.signUp({

      email,
      password

    });


  if(result.error){

    showMessage(
      "登録できませんでした。\n\n"+
      result.error.message
    );

    return;
  }


  if(!result.data.session){

    showMessage(
      "アカウント登録が完了しました。\n\n"+
      "メール確認が必要な設定の場合は、"+
      "確認メールを開いてからログインしてください。",
      "success"
    );

    return;
  }


  user=result.data.user;


  const rpc=
    await supabaseClient.rpc(
      "family_app_v2_create_family",
      {
        p_family_name:familyName,
        p_name:name
      }
    );


  if(rpc.error){

    showMessage(
      "アカウント登録は成功しましたが、"+
      "家族作成に失敗しました。\n\n"+
      rpc.error.message
    );

    return;
  }


  alert(
    "家族を作成しました！\n\n"+
    "家族コード："+
    rpc.data.family_code+
    "\n\n"+
    "親招待コード："+
    rpc.data.parent_invite_code
  );


  await loadUserFamily();

}


/* =====================================
   家族参加
===================================== */

async function join(){

  clearMessage();

  const familyCode=
    $("joinFamilyCode").value.trim();

  const name=
    $("joinUserName").value.trim();

  const email=
    $("joinUserEmail").value.trim();

  const password=
    $("joinUserPassword").value;

  const role=
    $("joinRole").value;

  const invite=
    $("parentInvite").value.trim();


  if(
    !familyCode ||
    !name ||
    !email ||
    !password
  ){

    showMessage(
      "必要な項目を入力してください。"
    );

    return;
  }


  if(role==="parent" && !invite){

    showMessage(
      "親招待コードを入力してください。"
    );

    return;
  }


  const result=
    await supabaseClient.auth.signUp({

      email,
      password

    });


  if(result.error){

    showMessage(
      "登録できませんでした。\n\n"+
      result.error.message
    );

    return;
  }


  if(!result.data.session){

    showMessage(
      "アカウントを登録しました。\n\n"+
      "メール確認後にログインしてください。",
      "success"
    );

    return;
  }


  user=result.data.user;


  let rpc;


  if(role==="child"){

    rpc=
      await supabaseClient.rpc(
        "family_app_v2_join_family",
        {
          p_family_code:familyCode,
          p_name:name
        }
      );

  }else{

    rpc=
      await supabaseClient.rpc(
        "family_app_v2_join_as_parent",
        {
          p_invite_code:invite,
          p_name:name
        }
      );

  }


  if(rpc.error){

    showMessage(
      "家族参加に失敗しました。\n\n"+
      rpc.error.message
    );

    return;
  }


  await loadUserFamily();

}


/* =====================================
   アプリ表示
===================================== */

function openApp(){

  $("auth").style.display="none";
  $("app").style.display="block";


  $("familyNameHeader").textContent=
    family.family_name;


  let roleText="🧒 子ども";


  if(member.role==="parent"){
    roleText="👨‍👩‍👧 親";
  }

  if(member.role==="president"){
    roleText="👑 子ども大統領";
  }


  $("roleBadge").textContent=
    roleText;


  $("homeFamily").textContent=
    family.family_name;


  $("homeCode").textContent=
    family.family_code;


  $("homeUser").textContent=
    member.name;


  $("homeRole").textContent=
    roleText;


  if(member.role==="parent"){

    $("parentArea")
      .classList
      .remove("hidden");

  }


  loadMembers();
  loadCalendar();

}


/* =====================================
   家族一覧
   ★ RPCを使用
===================================== */

async function loadMembers(){

  if(!family){
    return;
  }


  const result=
    await supabaseClient.rpc(
      "family_app_v2_get_members",
      {
        p_family_id:family.id
      }
    );


  if(result.error){

    $("membersList").innerHTML=
      `<div class="error">
        ${escapeHTML(result.error.message)}
      </div>`;

    return;
  }


  if(
    !result.data ||
    result.data.length===0
  ){

    $("membersList").innerHTML=
      `<div class="empty">
        メンバーはいません。
      </div>`;

    return;
  }


  $("membersList").innerHTML=
    result.data.map(x=>{

      let icon="🧒";
      let role="子ども";


      if(x.role==="parent"){

        icon="👨‍👩‍👧";
        role="親";

      }


      if(x.role==="president"){

        icon="👑";
        role="子ども大統領";

      }


      return `
        <div class="item">

          <div class="itemTitle">
            ${icon}
            ${escapeHTML(x.name)}
          </div>

          <div class="meta">
            ${escapeHTML(role)}
          </div>

        </div>
      `;

    }).join("");

}


/* =====================================
   親招待コード
===================================== */

async function createParentInvite(){

  if(!family){
    return;
  }


  if(
    member.role!=="parent"
  ){

    alert(
      "親だけが親招待コードを発行できます。"
    );

    return;
  }


  const result=
    await supabaseClient.rpc(
      "family_app_v2_create_parent_invite",
      {
        p_family_id:family.id
      }
    );


  if(result.error){

    alert(result.error.message);

    return;
  }


  $("inviteResult").innerHTML=`

    <div class="successBox">

      <b>親招待コード</b>

      <div class="stat">
        ${escapeHTML(result.data)}
      </div>

      <p>
        このコードを追加する親に渡してください。
      </p>

    </div>

  `;

}


/* =====================================
   カレンダー
===================================== */

async function loadCalendar(){

  if(!family){
    return;
  }


  const result=
    await supabaseClient
      .from("family_app_v2_events")
      .select("*")
      .eq("family_id",family.id)
      .order("event_date");


  if(result.error){

    $("calendarList").innerHTML=
      `<div class="empty">
        カレンダー機能のSQLがまだ設定されていません。
      </div>`;

    return;
  }


  if(!result.data.length){

    $("calendarList").innerHTML=
      `<div class="empty">
        予定はありません。
      </div>`;

    return;
  }


  $("calendarList").innerHTML=
    result.data.map(x=>`

      <div class="item">

        <div class="itemTitle">
          📅 ${escapeHTML(x.title)}
        </div>

        <div class="meta">
          ${escapeHTML(x.event_date || "")}
        </div>

      </div>

    `).join("");

}


/* =====================================
   カレンダー追加
===================================== */

async function addCalendarEvent(){

  if(
    member.role!=="parent" &&
    member.role!=="president"
  ){

    alert(
      "予定を追加できるのは親または子ども大統領です。"
    );

    return;
  }


  const title=
    prompt("予定名");


  if(!title){
    return;
  }


  const date=
    prompt(
      "日付\n例：2026-08-25"
    );


  if(!date){
    return;
  }


  const result=
    await supabaseClient
      .from("family_app_v2_events")
      .insert({

        family_id:family.id,
        title:title,
        event_date:date,
        created_by:user.id

      });


  if(result.error){

    alert(
      "予定を追加できませんでした。\n\n"+
      result.error.message
    );

    return;
  }


  loadCalendar();

}


/* =====================================
   ページ切替
===================================== */

function page(id,button){

  document
    .querySelectorAll(".page")
    .forEach(
      x=>x.classList.remove("active")
    );


  $(id).classList.add("active");


  document
    .querySelectorAll("nav button")
    .forEach(
      x=>x.classList.remove("active")
    );


  button.classList.add("active");

}


/* =====================================
   ログアウト
===================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  user=null;
  member=null;
  family=null;

  showLogin();

}


/* =====================================
   ログイン画面
===================================== */

function showLogin(){

  $("app").style.display="none";
  $("auth").style.display="flex";

  mode("login");

}


/* =====================================
   起動
===================================== */

(async function(){

  const result=
    await supabaseClient.auth.getSession();


  if(
    result.data &&
    result.data.session
  ){

    user=result.data.session.user;

    await loadUserFamily();

  }else{

    showLogin();

  }

})();


mode("login");

</script>
